ext { junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2' }
buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.7.2' } }
apply plugin: 'com.android.library'
android { namespace "in.zanisheluxe.caprogress.filevault"; compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  defaultConfig { minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23; targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35 }
}
repositories { google(); mavenCentral() }
dependencies { implementation project(':capacitor-android'); testImplementation "junit:junit:$junitVersion" }
