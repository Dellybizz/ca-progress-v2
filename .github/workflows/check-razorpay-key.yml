name: Check Razorpay Key Presence

on:
  push:
    branches: [phase-12-operations-admin-platform]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: v2-staging
    steps:
      - name: Check RAZORPAY_KEY_ID presence
        shell: bash
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          if [ -n "$RAZORPAY_KEY_ID" ]; then
            echo "RAZORPAY_KEY_ID_PRESENT=yes"
          else
            echo "RAZORPAY_KEY_ID_PRESENT=no"
          fi
