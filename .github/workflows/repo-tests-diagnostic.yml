name: Repository Test Diagnostic

on:
  push:
    branches: [phase-12-operations-admin-platform]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.tests.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - id: tests
        name: Run known failing tests with assertion output
        shell: bash
        run: |
          set +e
          failed=""
          for file in \
            tests/cloudflare-migration-phase1.test.mjs \
            tests/dashboard-minimal-navigation.test.mjs \
            tests/dashboard-visual-qa.test.mjs \
            tests/phase2-onboarding.test.mjs \
            tests/phase3-academic.test.mjs \
            tests/phase4-dashboard.test.mjs \
            tests/phase5-dashboard.test.mjs \
            tests/phase6-dashboard-analytics.test.mjs \
            tests/phase6-routes-responsive.test.mjs \
            tests/phase8-engine.test.mjs \
            tests/phase9-planner-engine.test.mjs \
            tests/phase9-routes-responsive.test.mjs; do
            echo "===== $file ====="
            node --test "$file"
            status=$?
            if [ "$status" -ne 0 ]; then
              name="$(basename "$file")"
              if [ -n "$failed" ]; then failed="$failed,$name"; else failed="$name"; fi
            fi
          done
          if [ -z "$failed" ]; then failed="none"; fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

  result:
    needs: scan
    name: "Failing tests - ${{ needs.scan.outputs.failed }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Repository test diagnostic complete."
