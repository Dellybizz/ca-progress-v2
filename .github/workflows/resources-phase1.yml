name: Resources verification and web release
run-name: Resources release ${{ github.event.pull_request.head.sha || github.sha }}
on:
  push:
    branches: [onboarding-design-phase7]
    paths:
      - app/**
      - components/resources/**
      - components/notes/**
      - lib/resources/**
      - lib/auth/proxy.ts
      - lib/billing/service.ts
      - workers/resources-preview/**
      - apps/mobile/**
      - public/resource-preview/**
      - lib/notes/**
      - lib/offline/**
      - d1/**
      - scripts/resources/**
      - scripts/notes/**
      - tests/**
      - .github/workflows/resources-phase1.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resources-phase1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || (github.head_ref == 'onboarding-design-phase7' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
      - run: npm run d1:hot-indexes:validate
      - run: npm run native:bundle
      - run: node scripts/resources/phase1-search-benchmark.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify real components at desktop and mobile widths
        run: |
          node scripts/resources/phase1-preview-build.mjs
          node scripts/resources/design-reset-phase2-browser-check.mjs
          node scripts/resources/instant-browser-check.mjs
          node scripts/resources/phase1-browser-check.mjs
          node scripts/resources/file-manager-navigation-browser-check.mjs
          node scripts/resources/file-manager-interactions-browser-check.mjs
          node scripts/resources/file-manager-dialogs-browser-check.mjs
          node scripts/resources/file-manager-visual-browser-check.mjs
          node scripts/resources/phase2-preview-build.mjs
          node scripts/resources/phase2-browser-check.mjs
          node scripts/resources/file-manager-transfers-browser-check.mjs
          node scripts/notes/preview-build.mjs
          node scripts/notes/direct-hierarchy-check.mjs
          node scripts/notes/browser-check.mjs
          node scripts/notes/performance-check.mjs
          node scripts/notes/inline-financial-check.mjs
          node scripts/notes/accounting-check.mjs
          node scripts/notes/catalogue-working-check.mjs
          node scripts/notes/inline-object-check.mjs
          node scripts/notes/workflow-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resources-phase1-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/resources-phase1-preview/workspace-*.png
            /tmp/resources-phase2-preview/transfers-*.png
            /tmp/note-studio-preview/notes-*.png
            /tmp/note-studio-preview/notes-print*.pdf
          if-no-files-found: ignore
  editor-certification:
    if: github.event_name != 'pull_request' || (github.head_ref == 'onboarding-design-phase7' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit
      - name: Certify editing, clipboard, read-only and touch controls
        run: |
          node scripts/notes/preview-build.mjs
          node scripts/notes/certification-check.mjs
          NOTES_TEST_ENGINE=webkit node scripts/notes/certification-check.mjs
          node scripts/notes/register-check.mjs
          NOTES_TEST_ENGINE=webkit node scripts/notes/register-check.mjs
          node scripts/notes/manipulation-check.mjs
          NOTES_TEST_ENGINE=webkit node scripts/notes/manipulation-check.mjs
          node scripts/notes/layout-repair-check.mjs
          NOTES_TEST_ENGINE=webkit node scripts/notes/layout-repair-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-editor-certification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/note-studio-preview/notes-certification-*.json
            /tmp/note-studio-preview/notes-register-*
            /tmp/note-studio-preview/notes-manipulation-*
            /tmp/note-studio-preview/notes-layout-*
          if-no-files-found: warn
  deploy:
    needs: [verify, editor-certification]
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEPLOY_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      NEXT_PUBLIC_OFFLINE_ENABLED: "true"
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: cloudflare-retired
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Check exact branch head before deployment
        run: |
          test "$(git ls-remote origin "refs/heads/$DEPLOY_BRANCH" | cut -f1)" = "$DEPLOY_SHA"
      - name: Validate migration rehearsal
        run: node scripts/payments/rehearse-owner-migrations.mjs
      - name: Build and validate Worker
        run: |
          npm run cf:build
          npm run cf:check:web
          npm run cf:smoke
      - name: Verify private backup restore before migration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/resources-phase1-d1.sql' EXIT
          npx wrangler d1 export ca-progress-v2-phase4-shadow --remote --config wrangler.jsonc --output /tmp/resources-phase1-d1.sql
          node scripts/resources/phase1-restore-drill.mjs /tmp/resources-phase1-d1.sql
      - name: Apply retained additive migrations
        run: npm run cf:migrate:retained
      - name: Verify workspace migration ledger
        run: npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config wrangler.jsonc --command "SELECT version FROM _ca_schema_migrations WHERE version IN ('0095','0096','0097','0098'); PRAGMA foreign_key_check;"
      - name: Deploy isolated resource preview processor
        run: |
          node scripts/check-cloudflare-size-budget.mjs --config workers/resources-preview/wrangler.jsonc --budget-mib 0.75
          npx wrangler deploy -c workers/resources-preview/wrangler.jsonc
      - name: Deploy verified web build
        run: npm run cf:deploy:web
      - name: Verify live resource authentication boundary
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://ca-progress-v2.habeebaasif622.workers.dev/api/resources/workspace)" = "401"
      - name: Verify live upload middleware and authentication boundaries
        run: node scripts/resources/verify-live-upload-boundary.mjs
      - name: Verify real signed-in upload through D1 and R2
        env:
          VERIFY_FILE_MANAGER_PHASE4: "true"
          VERIFY_RESOURCE_SHARING: "true"
        run: node scripts/resources/verify-live-upload-roundtrip.mjs
