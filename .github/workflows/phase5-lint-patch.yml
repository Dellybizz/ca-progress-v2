name: Phase 5 Lint Hardening Patch

on:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/phase5-lint-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-operations-admin-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lint hardening
        shell: python
        run: |
          from pathlib import Path
          compat = Path("lib/data/d1/supabase-compat.ts")
          text = compat.read_text(); old='let data=(result.results??[]).map(decodeRow);'; new='const data=(result.results??[]).map(decodeRow)'
          if old in text: text=text.replace(old,new+';',1)
          elif new not in text: raise SystemExit("compat lint target not found")
          compat.write_text(text)
          for path,var,marker in [("custom-worker.ts","worker","export default {"),("workers/icai-sync/index.ts","icaiSyncWorker","export default {")]:
            p=Path(path); text=p.read_text()
            if marker in text:
              text=text.replace(marker,f'const {var} = {{',1).rstrip()
              if not text.endswith('};'): raise SystemExit(f"{path} export terminator not found")
              text += f'\n\nexport default {var};\n'
            elif f'export default {var};' not in text: raise SystemExit(f"{path} export target not found")
            p.write_text(text)
          p=Path("workers/billing/index.ts"); text=p.read_text(); marker='export default {async fetch('
          if marker in text:
            text=text.replace(marker,'const billingWorker = {async fetch(',1).rstrip()
            if not text.endswith('};'): raise SystemExit("billing export terminator not found")
            text += '\n\nexport default billingWorker;\n'
          elif 'export default billingWorker;' not in text: raise SystemExit("billing export target not found")
          p.write_text(text)
      - name: Verify hardening
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/d1/supabase-compat.ts custom-worker.ts workers/billing/index.ts workers/icai-sync/index.ts
          git commit -m "Harden Phase 5 D1 Worker lint gates"
          git push origin HEAD:phase-12-operations-admin-platform
