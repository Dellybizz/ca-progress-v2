name: ICAI Bootstrap Admin Patch
on:
  push:
    branches: [phase-12-operations-admin-platform]
    paths: [.github/workflows/icai-bootstrap-admin-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-operations-admin-platform
          fetch-depth: 0
      - name: Apply bounded bootstrap and review patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}")
              p.write_text(text.replace(old, new, 1))

          path = "workers/icai-sync/sync-engine.ts"
          replace_one(path,
          '''} from "./runtime-control";\n''',
          '''} from "./runtime-control";\nimport { applyIcaiWindowPolicy, completedAdapterConfig } from "./bootstrap-policy";\nimport { resolveDirectStudyMaterialPdfs } from "./direct-resource-resolver";\n''')

          old = '''  await stage("parsing");\n  const parsed = parseOfficialSource(fetched.html, source, subjectLookups);\n  const parsedItemCount =\n    parsed.resources.length + parsed.attempts.length + parsed.events.length;\n  const allowEmpty = source.adapterConfig.allow_empty === true;\n  if (parsedItemCount === 0 && !allowEmpty)\n    throw new Error(\n      "Parser returned zero academic items. Last verified data was preserved for review.",\n    );\n  await stage("comparing");\n  const canonicalHash = await sha256Hex(stableJson(parsed));\n  const snapshot = { ...snapshotBase, canonical_hash: canonicalHash };\n'''
          new = '''  await stage("parsing");\n  const discovered = parseOfficialSource(fetched.html, source, subjectLookups);\n  const discoveredItemCount =\n    discovered.resources.length + discovered.attempts.length + discovered.events.length;\n  const allowEmpty = source.adapterConfig.allow_empty === true;\n  if (discoveredItemCount === 0 && !allowEmpty)\n    throw new Error(\n      "Parser returned zero academic items. Last verified data was preserved for review.",\n    );\n\n  const direct = await resolveDirectStudyMaterialPdfs(\n    discovered,\n    source,\n    subjectLookups,\n    runtime.userAgent,\n  );\n  const windowed = applyIcaiWindowPolicy(direct.payload, source);\n  const parsed = windowed.payload;\n  const parsedItemCount =\n    parsed.resources.length + parsed.attempts.length + parsed.events.length;\n\n  await stage("comparing");\n  const canonicalHash = await sha256Hex(stableJson(parsed));\n  const snapshot = {\n    ...snapshotBase,\n    canonical_hash: canonicalHash,\n    metadata: {\n      ...snapshotBase.metadata,\n      // A bounded window is intentionally not a complete historical listing.\n      // Never convert filtered history into destructive removal reviews.\n      authoritative_listing:\n        source.authoritativeListing &&\n        windowed.filteredCount === 0 &&\n        direct.droppedLandingPages === 0,\n      window_mode: windowed.mode,\n      bootstrap_attempt_floor: windowed.attemptFloor,\n      published_floor: windowed.publishedFloor,\n      filtered_item_count: windowed.filteredCount,\n      resolved_study_material_pages: direct.resolvedLandingPages,\n      dropped_study_material_pages: direct.droppedLandingPages,\n      parsed_item_count_after_window: parsedItemCount,\n    },\n  };\n'''
          replace_one(path, old, new)

          old = '''  await stage("writing");\n  const { error } = await client.rpc("icai_sync_apply_source_batch", {\n    p_run_id: runId,\n    p_source_id: source.id,\n    p_snapshot: snapshot as Json,\n    p_resources: resourcePayloads as Json,\n    p_attempts: attemptPayloads as Json,\n    p_events: eventPayloads as Json,\n  });\n  if (error) throw error;\n}\n\nasync function acquireRun(\n'''
          new = '''  await stage("writing");\n  const { error } = await client.rpc("icai_sync_apply_source_batch", {\n    p_run_id: runId,\n    p_source_id: source.id,\n    p_snapshot: snapshot as Json,\n    p_resources: resourcePayloads as Json,\n    p_attempts: attemptPayloads as Json,\n    p_events: eventPayloads as Json,\n  });\n  if (error) throw error;\n\n  if (windowed.mode === "bootstrap") {\n    const completedAt = new Date().toISOString();\n    await runtime.db\n      .prepare("UPDATE icai_sources SET adapter_config=?1,updated_at=?2 WHERE id=?3")\n      .bind(JSON.stringify(completedAdapterConfig(source, completedAt)), completedAt, source.id)\n      .run();\n  }\n}\n\nasync function acquireRun(\n'''
          replace_one(path, old, new)

          path = "lib/icai/query.ts"
          old = '''    reviews: ((reviewResponse.data ?? []) as ReviewRow[]).map((review) => {\n      const source = sourceById.get(review.source_id);\n      return {\n        id: review.id,\n        title: review.title,\n        reason: review.reason,\n        entityType: review.entity_type,\n        entityId: review.entity_id,\n        confidence: review.confidence,\n        sourceName: source?.name ?? review.source_id,\n        sourceUrl: source?.official_url ?? "",\n        createdAt: review.created_at,\n      };\n    }),\n'''
          new = '''    reviews: ((reviewResponse.data ?? []) as ReviewRow[]).map((review) => {\n      const source = sourceById.get(review.source_id);\n      const rawPatch = review.proposed_patch;\n      const proposedPatch =\n        rawPatch && typeof rawPatch === "object" && !Array.isArray(rawPatch)\n          ? (rawPatch as Record<string, unknown>)\n          : {};\n      const proposedSourceUrl =\n        typeof proposedPatch.source_url === "string"\n          ? proposedPatch.source_url\n          : null;\n      return {\n        id: review.id,\n        title: review.title,\n        reason: review.reason,\n        entityType: review.entity_type,\n        entityId: review.entity_id,\n        confidence: review.confidence,\n        sourceName: source?.name ?? review.source_id,\n        sourceUrl: proposedSourceUrl ?? source?.official_url ?? "",\n        proposedPatch,\n        createdAt: review.created_at,\n      };\n    }),\n'''
          replace_one(path, old, new)

          path = "app/(admin)/admin/icai-sync/actions.ts"
          text = Path(path).read_text()
          start = text.index('export async function decideIcaiReviewAction')
          replacement = '''export async function decideIcaiReviewAction(formData: FormData) {\n  let destination = "/admin/icai-sync/data";\n  try {\n    const operator = await requireAdminCapability("icai.review");\n    const reviewId = String(formData.get("reviewId") ?? "");\n    const decision = normalizeIcaiReviewDecision(formData.get("decision"));\n    if (!reviewId || !decision) throw new Error("Invalid review request.");\n    const result = await decideIcaiReview({ reviewId, decision, reviewerUserId: operator.user.id, notes: "" });\n    await recordAdminAuditEvent({ actorUserId: operator.user.id, actorRole: operator.role, capability: "icai.review", action: `icai.review.${decision}`, targetType: "icai_review", targetId: reviewId, reason: "ICAI high-impact review decision", newValue: { status: result.status }, traceId: traceId(), reversible: false });\n    await invalidateSharedPublicCache(["icai"]);\n    revalidatePath("/admin/icai-sync"); revalidatePath("/admin/icai-sync/data"); revalidatePath("/updates"); revalidatePath("/resources/icai");\n    destination = `/admin/icai-sync/data?notice=${encodeURIComponent(`Review ${result.status}. Student-facing data and audit history are now consistent.`)}`;\n  } catch (error) { destination = `/admin/icai-sync/data?error=${encodeURIComponent(message(error))}`; }\n  redirect(destination);\n}\n'''
          Path(path).write_text(text[:start] + replacement)
          PY
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/icai-bootstrap-admin-patch.yml
          git config user.name "Dellybizz"
          git config user.email "asmazuberi7@gmail.com"
          git add workers/icai-sync/sync-engine.ts lib/icai/query.ts app/\(admin\)/admin/icai-sync/actions.ts .github/workflows/icai-bootstrap-admin-patch.yml
          git commit -m "feat(icai): apply bounded bootstrap and review evidence"
          git push origin HEAD:phase-12-operations-admin-platform
