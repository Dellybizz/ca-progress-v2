name: Billing Subscription Phase 4 Legacy Repair

on:
  push:
    branches: [hotfix/dark-mode-ae0cb36d]
    paths:
      - .github/workflows/billing-subscription-phase4-repair.yml
      - scripts/repair-legacy-billing-phase4.mjs
      - tests/billing-subscription-repair-phase4.test.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: audit is read-only; repair performs the bounded legacy cancellation/reconciliation
        required: true
        default: audit
        type: choice
        options: [audit, repair]
      provider_offer_id:
        description: Genuine Razorpay Subscription Offer ID for Basic first-cycle pricing
        required: false
        type: string
      confirmation:
        description: For repair mode type REPAIR LEGACY INTRO SUBSCRIPTIONS
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: billing-subscription-phase4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase4:
    if: github.ref == 'refs/heads/hotfix/dark-mode-ae0cb36d'
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      CA_BILLING_PHASE4_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
      CA_BILLING_PHASE4_PROVIDER_OFFER_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_offer_id || '' }}
      CA_BILLING_PHASE4_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
      CA_BILLING_PHASE4_EVIDENCE_PATH: deployment-evidence/billing-subscription-phase4-repair.json
    steps:
      - name: Check out exact Phase 4 SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Phase 4 repair contracts
        run: node --test tests/billing-subscription-repair-phase4.test.mjs

      - name: Confirm production Billing Worker target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "ca-progress-v2-billing"' workers/billing/wrangler.jsonc
          grep -q '"database_id": "6f002cbe-fe40-4d1b-9cf4-df6faaf52350"' workers/billing/wrangler.jsonc

      - name: Audit or repair legacy intro subscriptions
        run: node scripts/repair-legacy-billing-phase4.mjs

      - name: Upload sanitized Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-subscription-phase4-${{ github.sha }}
          path: deployment-evidence/billing-subscription-phase4-repair.json
          if-no-files-found: error
          retention-days: 30
