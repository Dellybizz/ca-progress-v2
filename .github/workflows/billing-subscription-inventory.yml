name: Billing Subscription Inventory Phase 1

on:
  push:
    branches: [hotfix/dark-mode-ae0cb36d]
    paths:
      - .github/workflows/billing-subscription-inventory.yml
      - scripts/inventory-billing-subscriptions.mjs
      - tests/billing-subscription-inventory-phase1.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-subscription-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref == 'refs/heads/hotfix/dark-mode-ae0cb36d'
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      CA_BILLING_INVENTORY_EVIDENCE_PATH: deployment-evidence/billing-subscription-inventory.json
    steps:
      - name: Check out exact inventory SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Phase 1 read-only inventory contracts
        run: node --test tests/billing-subscription-inventory-phase1.test.mjs

      - name: Confirm production Billing Worker target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "ca-progress-v2-billing"' workers/billing/wrangler.jsonc
          grep -q '"database_id": "6f002cbe-fe40-4d1b-9cf4-df6faaf52350"' workers/billing/wrangler.jsonc

      - name: Inventory production subscriptions against Razorpay
        run: node scripts/inventory-billing-subscriptions.mjs

      - name: Upload sanitized inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-subscription-inventory-${{ github.sha }}
          path: deployment-evidence/billing-subscription-inventory.json
          if-no-files-found: error
          retention-days: 30
