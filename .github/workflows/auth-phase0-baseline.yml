name: Authentication Phase 0 D1 Baseline

on:
  workflow_dispatch:
  push:
    branches: [auth-phase0-baseline]
    paths:
      - .github/workflows/auth-phase0-baseline.yml
      - scripts/auth/phase0-baseline.sql

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Require Cloudflare access
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Capture recovery bookmark before any migration
        run: |
          mkdir -p deployment-evidence
          npx wrangler d1 time-travel info ca-progress-v2-phase4-shadow --config=wrangler.jsonc --json > deployment-evidence/auth-phase0-bookmark.json
          grep -q 'bookmark' deployment-evidence/auth-phase0-bookmark.json
      - name: Capture read-only counts and integrity findings
        run: |
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --json --file=scripts/auth/phase0-baseline.sql > deployment-evidence/auth-phase0-counts.json
          test -s deployment-evidence/auth-phase0-counts.json
      - name: Verify complete and consistent baseline
        run: node scripts/auth/verify-phase0.mjs deployment-evidence/auth-phase0-bookmark.json deployment-evidence/auth-phase0-counts.json
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: auth-phase0-recovery-${{ github.run_id }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30
