name: Check Razorpay Webhook Secret Presence

on:
  push:
    branches: [phase-12-operations-admin-platform]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: v2-staging
    steps:
      - name: Check RAZORPAY_WEBHOOK_SECRET presence
        shell: bash
        env:
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          if [ -n "$RAZORPAY_WEBHOOK_SECRET" ]; then
            echo "RAZORPAY_WEBHOOK_SECRET_PRESENT=yes"
          else
            echo "RAZORPAY_WEBHOOK_SECRET_PRESENT=no"
          fi
