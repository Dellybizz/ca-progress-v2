name: ICAI Live Admin and Fetch Verification

on:
  workflow_dispatch:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/icai-live-verification.yml

permissions:
  contents: read

concurrency:
  group: icai-live-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CA_AUTH_SESSION_SECRET: ${{ secrets.CA_AUTH_SESSION_SECRET }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      LINKEDIN_OIDC_CLIENT_ID: ${{ secrets.LINKEDIN_OIDC_CLIENT_ID }}
      LINKEDIN_OIDC_CLIENT_SECRET: ${{ secrets.LINKEDIN_OIDC_CLIENT_SECRET }}
      ADMIN_PHASE1_AUTH_COOKIE: ${{ secrets.ADMIN_PHASE1_AUTH_COOKIE }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: cloudflare-retired
      DEPLOY_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Focused ICAI Phase 5 verification
        run: npm run test:icai:phase5
      - name: Prepare evidence
        run: mkdir -p deployment-evidence
      - name: Apply ICAI continuation schema
        run: npm run cf:migrate:icai-continuation
      - name: Verify ICAI continuation schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='icai_sync_source_states'; SELECT version,description FROM _ca_schema_migrations WHERE version='0028';" > deployment-evidence/icai-continuation-schema.json
          grep -q 'icai_sync_source_states' deployment-evidence/icai-continuation-schema.json
          grep -q '0028' deployment-evidence/icai-continuation-schema.json
      - name: Deploy current ICAI service
        run: npx wrangler deploy --config=workers/icai-sync/wrangler.jsonc --name=ca-progress-v2-icai-sync
      - name: Deploy current web and Queue runtime
        run: npm run cf:deploy:web
      - name: Verify cookie-authenticated ICAI admin page
        run: node scripts/verify-icai-admin-live.mjs
      - name: Run real ICAI Queue and source-fetch proof
        shell: bash
        run: |
          set +e
          node scripts/verify-icai-phase5-live.mjs
          result=$?
          if [ "$result" -ne 0 ]; then
            npx wrangler rollback --name ca-progress-v2-icai-sync --message "Automated rollback after isolated ICAI live verification failure" || true
            npx wrangler rollback --name ca-progress-v2 --message "Automated rollback after isolated ICAI live verification failure" || true
          fi
          exit "$result"
      - name: Capture final ICAI state
        if: always()
        shell: bash
        run: |
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --json --command "SELECT id,trigger,status,source_total,source_processed,source_succeeded,source_failed,started_at,finished_at,error_summary FROM icai_sync_runs ORDER BY started_at DESC LIMIT 3; SELECT run_id,source_id,source_index,status,attempts,last_error,started_at,finished_at FROM icai_sync_source_states ORDER BY created_at DESC LIMIT 12; SELECT run_id,source_id,http_status,parsed_item_count,content_changed,created_at FROM icai_source_snapshots ORDER BY created_at DESC LIMIT 12;" > deployment-evidence/icai-live-final-state.json || true
      - name: Upload ICAI live evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: icai-live-verification-${{ github.run_id }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 30
