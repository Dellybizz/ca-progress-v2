name: Supabase Retirement Stage 2 Recovery Inspect

on:
  push:
    branches: [stage2-recovery-temp]
    paths:
      - .github/workflows/supabase-retirement-stage2-apply-blob.yml

permissions:
  contents: read

jobs:
  inspect-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGE2_BUNDLE_BLOB: b40e0f8dd3e0ea1cac0f064913f3677d101ebede
    steps:
      - uses: actions/checkout@v5
      - name: Inspect prepared blob encoding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .stage2
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${STAGE2_BUNDLE_BLOB}" --jq .content | tr -d '\n' | base64 -d > .stage2/blob.bin
          echo "bytes=$(wc -c < .stage2/blob.bin)"
          file .stage2/blob.bin || true
          echo "first64="
          xxd -l 64 -g 1 .stage2/blob.bin
          echo "strings="
          strings -n 8 .stage2/blob.bin | head -40 || true
