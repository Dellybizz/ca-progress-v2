name: Cloudflare V2 Deploy

# Canonical web Worker configuration: wrangler.jsonc
on:
  workflow_dispatch:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/deploy-staging.yml
      - app/**
      - components/**
      - d1/**
      - lib/**
      - server/**
      - workers/**
      - scripts/**
      - tests/**
      - custom-worker.ts
      - wrangler.jsonc
      - package.json

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CA_AUTH_SESSION_SECRET: ${{ secrets.CA_AUTH_SESSION_SECRET }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      LINKEDIN_OIDC_CLIENT_ID: ${{ secrets.LINKEDIN_OIDC_CLIENT_ID }}
      LINKEDIN_OIDC_CLIENT_SECRET: ${{ secrets.LINKEDIN_OIDC_CLIENT_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      SMOKE_AUTH_COOKIE: ${{ secrets.SMOKE_AUTH_COOKIE }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: cloudflare-retired
      DEPLOY_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Enforce permanent Supabase retirement
        run: npm run verify:retirement
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate retained D1 hot-query indexes
        run: npm run d1:hot-indexes:validate
      - name: Repository tests
        run: npm test
      - name: Next.js production build
        run: npm run build
      - name: OpenNext build and production Worker dry-runs
        run: npm run cf:check
      - name: Smoke generated Cloudflare SSR routes
        run: npm run cf:smoke

      - name: Capture pre-deploy evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          npx wrangler deployments list --name ca-progress-v2 --json > deployment-evidence/web-before.json
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --command "SELECT COUNT(*) AS users FROM app_users; PRAGMA foreign_key_check;" > deployment-evidence/d1-before.txt

      # The retained production D1 predates Wrangler's migration journal and already
      # contains historical 0003-0011 schema changes. Fresh/local databases still
      # validate the complete ordered migration chain. Production therefore reapplies
      # only additive idempotent product and ICAI migrations directly before Worker rollout.
      - name: Apply additive Product D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0012_product_phase0_autofetch_contracts.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0013_product_phase2_onboarding_experience.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0014_product_phase3_study_sessions_reflection.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0015_product_phase4_progress_test_integration.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0016_product_phase5_test_archive.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0017_product_phase6_revision_notes.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0018_product_phase7_community_verification.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0019_product_phase8_planning_notifications.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0020_product_phase10_study_profiles.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0021_product_phase11_study_buddy.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0022_product_phase12_gamification.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0023_product_phase13_leaderboards_rewards_referrals.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0024_icai_source_bootstrap.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --file=d1/migrations/0025_icai_review_audit.sql
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --command "SELECT version,description FROM _ca_schema_migrations WHERE version IN ('0012','0013','0014','0015','0016','0017','0018','0019','0020','0021','0022','0023','0024','0025') ORDER BY version; SELECT COUNT(*) AS autofetch_targets FROM autofetch_content_targets; SELECT COUNT(*) AS autofetch_sources FROM autofetch_source_registry; SELECT COUNT(*) AS autofetch_resources FROM autofetch_resource_records; SELECT COUNT(*) AS onboarding_experience_rows FROM onboarding_experience; SELECT COUNT(*) AS phase3_session_rows FROM study_session_phase3; SELECT COUNT(*) AS phase3_doubt_rows FROM study_session_doubts; SELECT COUNT(*) AS phase4_test_stage_records FROM test_stage_records; SELECT COUNT(*) AS phase5_test_attempts FROM test_attempts; SELECT COUNT(*) AS phase5_test_mistakes FROM test_attempt_mistakes; SELECT COUNT(*) AS phase5_test_attachments FROM test_attempt_attachments; SELECT COUNT(*) AS phase6_revision_notes FROM note_revision_metadata; SELECT COUNT(*) AS phase6_note_files FROM note_resource_links; SELECT COUNT(*) AS phase7_verifications FROM community_verifications; SELECT COUNT(*) AS phase7_follows FROM community_follows; SELECT COUNT(*) AS phase7_saved_messages FROM community_saved_messages; SELECT COUNT(*) AS phase8_task_extensions FROM planner_task_phase8; SELECT COUNT(*) AS phase8_goal_extensions FROM planner_goal_phase8; SELECT COUNT(*) AS phase8_notification_preferences FROM notification_preferences; SELECT COUNT(*) AS phase8_in_app_notifications FROM in_app_notifications; SELECT COUNT(*) AS phase10_study_profiles FROM study_profiles; SELECT COUNT(*) AS phase10_study_profile_buddies FROM study_profile_buddies; SELECT COUNT(*) AS phase11_study_buddy_relationships FROM study_buddy_relationships; SELECT COUNT(*) AS phase11_study_buddy_goals FROM study_buddy_goals; SELECT COUNT(*) AS phase11_study_together_sessions FROM study_together_sessions; SELECT COUNT(*) AS phase11_study_buddy_reports FROM study_buddy_reports; SELECT COUNT(*) AS phase12_xp_ledger FROM xp_ledger; SELECT COUNT(*) AS phase12_streak_days FROM study_streak_days; SELECT COUNT(*) AS phase12_achievements FROM user_achievements; SELECT COUNT(*) AS phase13_leaderboard_profiles FROM leaderboard_profiles; SELECT COUNT(*) AS phase13_bonus_ledger FROM gamification_bonus_ledger; SELECT COUNT(*) AS phase13_referrals FROM referrals; SELECT COUNT(*) AS phase13_anti_cheat_flags FROM anti_cheat_flags; SELECT COUNT(*) AS phase13_reward_grants FROM leaderboard_reward_grants; SELECT COUNT(*) AS icai_active_seeded_sources FROM icai_sources WHERE is_active=1 AND id IN ('icai-foundation-course','icai-intermediate-course','icai-final-course'); SELECT COUNT(*) AS icai_review_decisions FROM icai_review_decisions; PRAGMA foreign_key_check;" > deployment-evidence/d1-product-migrations.txt

      - name: Verify ICAI source bootstrap
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --json --command "SELECT id,official_url,adapter_key,level_codes,is_active FROM icai_sources WHERE id IN ('icai-foundation-course','icai-intermediate-course','icai-final-course') ORDER BY id;" > deployment-evidence/icai-source-bootstrap.json
          ICAI_BOOTSTRAP_JSON="$(cat deployment-evidence/icai-source-bootstrap.json)" node - <<'NODE'
          const payload = JSON.parse(process.env.ICAI_BOOTSTRAP_JSON || "[]");
          const rows = payload?.[0]?.results ?? [];
          const expected = new Map([
            ["icai-final-course", ["https://www.icai.org/category/final-course", "final"]],
            ["icai-foundation-course", ["https://www.icai.org/category/foundation-course", "foundation"]],
            ["icai-intermediate-course", ["https://www.icai.org/category/intermediate-course", "intermediate"]],
          ]);
          if (rows.length !== 3) throw new Error(`Expected 3 ICAI bootstrap sources, found ${rows.length}.`);
          for (const row of rows) {
            const wanted = expected.get(row.id);
            if (!wanted) throw new Error(`Unexpected ICAI bootstrap source ${row.id}.`);
            if (row.official_url !== wanted[0]) throw new Error(`Unexpected ICAI source URL for ${row.id}.`);
            if (row.adapter_key !== "resource_hub") throw new Error(`Unexpected ICAI adapter for ${row.id}.`);
            if (Number(row.is_active) !== 1) throw new Error(`ICAI source ${row.id} is not active.`);
            const levels = JSON.parse(row.level_codes || "[]");
            if (levels.length !== 1 || levels[0] !== wanted[1]) throw new Error(`Unexpected ICAI level scope for ${row.id}.`);
          }
          NODE

      - name: Verify ICAI review audit schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='icai_review_decisions'; SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('icai_review_queue_requires_audit','icai_review_queue_blocks_dismissal','icai_review_decisions_no_update','icai_review_decisions_no_delete') ORDER BY name;" > deployment-evidence/icai-review-audit.txt
          for name in icai_review_decisions icai_review_queue_requires_audit icai_review_queue_blocks_dismissal icai_review_decisions_no_update icai_review_decisions_no_delete; do
            grep -q "$name" deployment-evidence/icai-review-audit.txt || { echo "::error::Missing ICAI review audit object $name"; exit 1; }
          done

      - name: Prepare Billing Worker secret file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node - <<'NODE'
          const fs = require('fs');
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is required for deployment.`);
            return value;
          };
          fs.writeFileSync('/tmp/ca-billing-secrets.json', JSON.stringify({
            RAZORPAY_KEY_ID: required('RAZORPAY_KEY_ID'),
            RAZORPAY_KEY_SECRET: required('RAZORPAY_KEY_SECRET'),
            RAZORPAY_WEBHOOK_SECRET: required('RAZORPAY_WEBHOOK_SECRET'),
          }));
          NODE

      - name: Deploy ICAI service
        run: npx wrangler deploy --config=workers/icai-sync/wrangler.jsonc --name=ca-progress-v2-icai-sync

      - name: Deploy Billing service
        run: npx wrangler deploy --config=workers/billing/wrangler.jsonc --secrets-file /tmp/ca-billing-secrets.json

      - name: Verify existing web Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.jsonc > deployment-evidence/web-secrets.json
          for name in CA_AUTH_SESSION_SECRET GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET LINKEDIN_OIDC_CLIENT_ID LINKEDIN_OIDC_CLIENT_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            grep -q "\"name\": \"$name\"" deployment-evidence/web-secrets.json || { echo "::error::$name is missing from web Worker"; exit 1; }
          done

      - name: Deploy web runtime
        run: npm run cf:deploy:web

      - name: Verify deployment and rollback web runtime on failure
        shell: bash
        run: |
          set +e
          failed=0
          base="$DEPLOY_BASE_URL"
          SMOKE_BASE_URL="$base" SMOKE_AUTH_COOKIE="${SMOKE_AUTH_COOKIE:-}" npm run cf:smoke || failed=1
          health="$(curl --max-time 20 -fsS "$base/api/health" 2>/dev/null)" || failed=1
          if [ -n "$health" ]; then
            HEALTH_JSON="$health" node -e 'const x=JSON.parse(process.env.HEALTH_JSON); if(x.status!=="ok" || x.checks?.database!=="ok") process.exit(1)' || failed=1
          fi
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --command "SELECT COUNT(*) AS users FROM app_users; PRAGMA foreign_key_check; SELECT COUNT(*) AS autofetch_targets FROM autofetch_content_targets; SELECT COUNT(*) AS autofetch_resources FROM autofetch_resource_records; SELECT COUNT(*) AS onboarding_experience_rows FROM onboarding_experience; SELECT COUNT(*) AS phase3_session_rows FROM study_session_phase3; SELECT COUNT(*) AS phase3_doubt_rows FROM study_session_doubts; SELECT COUNT(*) AS phase4_test_stage_records FROM test_stage_records; SELECT COUNT(*) AS phase5_test_attempts FROM test_attempts; SELECT COUNT(*) AS phase5_test_mistakes FROM test_attempt_mistakes; SELECT COUNT(*) AS phase5_test_attachments FROM test_attempt_attachments; SELECT COUNT(*) AS phase6_revision_notes FROM note_revision_metadata; SELECT COUNT(*) AS phase6_note_files FROM note_resource_links; SELECT COUNT(*) AS phase7_verifications FROM community_verifications; SELECT COUNT(*) AS phase7_follows FROM community_follows; SELECT COUNT(*) AS phase7_saved_messages FROM community_saved_messages; SELECT COUNT(*) AS phase8_task_extensions FROM planner_task_phase8; SELECT COUNT(*) AS phase8_goal_extensions FROM planner_goal_phase8; SELECT COUNT(*) AS phase8_notification_preferences FROM notification_preferences; SELECT COUNT(*) AS phase8_in_app_notifications FROM in_app_notifications; SELECT COUNT(*) AS phase10_study_profiles FROM study_profiles; SELECT COUNT(*) AS phase10_study_profile_buddies FROM study_profile_buddies; SELECT COUNT(*) AS phase11_study_buddy_relationships FROM study_buddy_relationships; SELECT COUNT(*) AS phase11_study_buddy_goals FROM study_buddy_goals; SELECT COUNT(*) AS phase11_study_together_sessions FROM study_together_sessions; SELECT COUNT(*) AS phase11_study_buddy_reports FROM study_buddy_reports; SELECT COUNT(*) AS phase12_xp_ledger FROM xp_ledger; SELECT COUNT(*) AS phase12_streak_days FROM study_streak_days; SELECT COUNT(*) AS phase12_achievements FROM user_achievements; SELECT COUNT(*) AS phase13_leaderboard_profiles FROM leaderboard_profiles; SELECT COUNT(*) AS phase13_bonus_ledger FROM gamification_bonus_ledger; SELECT COUNT(*) AS phase13_referrals FROM referrals; SELECT COUNT(*) AS phase13_anti_cheat_flags FROM anti_cheat_flags; SELECT COUNT(*) AS phase13_reward_grants FROM leaderboard_reward_grants; SELECT COUNT(*) AS icai_active_seeded_sources FROM icai_sources WHERE is_active=1 AND id IN ('icai-foundation-course','icai-intermediate-course','icai-final-course'); SELECT COUNT(*) AS icai_review_decisions FROM icai_review_decisions;" > deployment-evidence/d1-after.txt || failed=1
          npx wrangler deployments list --name ca-progress-v2 --json > deployment-evidence/web-after.json || failed=1
          if [ "$failed" -ne 0 ]; then
            npx wrangler rollback --name ca-progress-v2 --message "Automated rollback after failed deployment smoke" || true
            exit 1
          fi
          echo "Cloudflare deployment verification PASS."

      - name: Remove ephemeral secret file
        if: always()
        run: rm -f /tmp/ca-billing-secrets.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cloudflare-deployment-${{ github.run_id }}
          retention-days: 30
          path: deployment-evidence/
