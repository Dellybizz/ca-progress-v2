name: Deploy V2 Staging to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: phase-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate hybrid Cloudflare Worker bundles and size budgets
        run: npm run cf:check
      - name: Deploy specialist services and consolidated web Worker
        run: npm run cf:deploy:services && npm run cf:deploy:web

# This workflow is an optional manual fallback. The normal web deployment remains a
# single Cloudflare Connected Build for ca-progress-v2. ICAI, Billing and Admin Ops
# remain independently deployable private services and are not split Next.js domains.
# Runtime secrets remain dashboard-managed and are preserved with keep_vars=true.
# Razorpay secrets remain only on ca-progress-v2-billing.
