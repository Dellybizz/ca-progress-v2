name: Deploy V2 Staging to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: phase-7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run cf:deploy

# Phase 8 runtime secrets (SUPABASE_SERVICE_ROLE_KEY and ICAI_CRON_SECRET) remain active.
# Phase 7 user file bytes use the private USER_RESOURCES_R2 binding declared in wrangler.jsonc.
# R2 binding access does not require an R2 access key or secret inside application code.
# wrangler.jsonc uses keep_vars=true so dashboard-managed secrets survive deploys.
