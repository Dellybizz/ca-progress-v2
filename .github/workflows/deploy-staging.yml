name: Deploy V2 Staging to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: phase-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate all Cloudflare Worker bundles and size budgets
        run: npm run cf:check
      - name: Deploy validated multi-Worker build
        run: npm run cf:deploy:built

# Staging deployment is intentionally orchestrated from GitHub Actions rather than
# Cloudflare Connected Builds. Connected Builds enforce the one connected Worker
# name, while this application deploys multiple independently named private Workers.
# Runtime secrets remain dashboard-managed and are preserved with keep_vars=true.
# Razorpay secrets remain only on ca-progress-v2-billing.
