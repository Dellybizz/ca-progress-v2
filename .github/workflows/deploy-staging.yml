name: Deploy V2 Staging to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: phase-11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run cf:deploy

# Runtime secrets remain dashboard-managed and are preserved with keep_vars=true.
# Phase 11 deploy order creates/updates private ICAI and Billing Workers before the web Worker.
# Add RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET as secrets on
# ca-progress-v2-billing. Until configured, paid checkout fails closed without changing plans.
# Phase 7 resource bytes remain private in USER_RESOURCES_R2.
