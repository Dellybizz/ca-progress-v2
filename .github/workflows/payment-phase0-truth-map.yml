name: Payment Phase 0 Truth Map

on:
  push:
    branches: [hotfix/dark-mode-ae0cb36d]
    paths:
      - .github/workflows/payment-phase0-truth-map.yml
      - scripts/audit-payment-phase0.mjs
      - tests/payment-phase0-truth-map.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-phase0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  truth-map:
    if: github.ref == 'refs/heads/hotfix/dark-mode-ae0cb36d'
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      CA_PAYMENT_PHASE0_EVIDENCE_PATH: deployment-evidence/payment-phase0-truth-map.json
    steps:
      - name: Check out exact audit SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify read-only Phase 0 contracts
        run: node --test tests/payment-phase0-truth-map.test.mjs

      - name: Confirm production Billing Worker target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "ca-progress-v2-billing"' workers/billing/wrangler.jsonc
          grep -q '"main": "./p4-closure.ts"' workers/billing/wrangler.jsonc
          grep -q '"database_id": "6f002cbe-fe40-4d1b-9cf4-df6faaf52350"' workers/billing/wrangler.jsonc

      - name: Build production payment truth map
        run: node scripts/audit-payment-phase0.mjs

      - name: Reject sensitive evidence fields
        run: |
          node -e 'const fs=require("fs");const p=process.env.CA_PAYMENT_PHASE0_EVIDENCE_PATH;const value=JSON.parse(fs.readFileSync(p,"utf8"));const forbidden=new Set(["key_secret","webhook_secret","authorization","raw_payload","email","phone"]);const visit=(v)=>{if(Array.isArray(v))return v.forEach(visit);if(v&&typeof v==="object")for(const [k,item] of Object.entries(v)){if(forbidden.has(k.toLowerCase()))throw new Error("Sensitive evidence field: "+k);visit(item)}};visit(value)'

      - name: Upload sanitized truth-map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-phase0-truth-map-${{ github.sha }}
          path: deployment-evidence/payment-phase0-truth-map.json
          if-no-files-found: error
          retention-days: 30
