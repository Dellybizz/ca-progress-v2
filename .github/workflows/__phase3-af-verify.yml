name: Temporary Phase 3A-3F Verification

on:
  push:
    branches: [icai-phase3-af-20260910]
    paths:
      - scripts/__phase3_af_finish.py
      - .github/workflows/__phase3-af-verify.yml

permissions:
  contents: write

jobs:
  phase3-af-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: icai-phase3-af-20260910
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply Phase 3A-3F closure
        run: python3 scripts/__phase3_af_finish.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Phase 3A-3F acceptance contracts
        run: node --test tests/icai-phase3-admin.test.mjs tests/icai-phase3b-controls.test.mjs tests/icai-phase3c-dashboard.test.mjs tests/icai-phase3d-data-page.test.mjs tests/icai-phase3ef-item-isolation.test.mjs tests/icai-sync-live-monitor-phase2.test.mjs
      - name: Focused ICAI suite
        run: npm run test:icai:phase5
      - name: Repository tests
        run: npm test
      - name: Clean D1 double-migration validation
        run: npm run d1:hot-indexes:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Next.js production build
        run: npm run build
      - name: Commit verified Phase 3A-3F tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ca-progress-phase3-bot"
          git config user.email "ca-progress-phase3-bot@users.noreply.github.com"
          git checkout -- package-lock.json tsconfig.tsbuildinfo 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m "feat(icai): complete Phase 3 item isolation and recovery"
          git push origin HEAD:icai-phase3-af-20260910
