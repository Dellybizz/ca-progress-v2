name: Reviewer Route E2E Diagnostic

on:
  push:
    branches: [hotfix/dark-mode-ae0cb36d]
    paths:
      - .github/workflows/reviewer-route-e2e.yml

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
      DIAG_REV: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Generate masked throwaway credential
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_ENV"
          const crypto=require("node:crypto");
          const password=crypto.randomBytes(24).toString("base64url");
          const salt=crypto.randomBytes(16);
          const hash=crypto.pbkdf2Sync(password,salt,310000,32,"sha256");
          console.log(`REVIEW_PASSWORD=${password}`);
          console.log(`REVIEW_SALT=${salt.toString("base64url")}`);
          console.log(`REVIEW_HASH=${hash.toString("base64url")}`);
          console.error(`::add-mask::${password}`);
          NODE

      - name: Install throwaway credential
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --command "UPDATE reviewer_credentials SET password_salt='${REVIEW_SALT}',password_hash='${REVIEW_HASH}',password_iterations=310000,failed_attempts=0,locked_until=NULL,last_login_at=NULL,updated_at=CURRENT_TIMESTAMP WHERE username_normalized='razorpay-review';"

      - name: POST live reviewer login
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --max-time 30 -sS -o /tmp/reviewer-body -D /tmp/reviewer-headers -w '%{http_code}'             -H "Origin: ${BASE_URL}"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "username=razorpay-review"             --data-urlencode "password=${REVIEW_PASSWORD}"             --data-urlencode "next=/billing"             --data-urlencode "remember=true"             "${BASE_URL}/auth/reviewer")"
          echo "HTTP_STATUS=${status}"
          grep -i '^location:' /tmp/reviewer-headers || true
          if [ "${status}" != "303" ]; then
            echo "::error::Reviewer login did not return 303."
            cat /tmp/reviewer-body
            exit 1
          fi
          if grep -qi 'error=reviewer_auth_failed' /tmp/reviewer-headers; then
            echo "::error::Reviewer route returned reviewer_auth_failed."
            exit 1
          fi

      - name: Inspect post-login state
        if: always()
        shell: bash
        run: |
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --json --command "SELECT failed_attempts,locked_until,last_login_at FROM reviewer_credentials WHERE username_normalized='razorpay-review';" || true

      - name: Restore real reviewer credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute ca-progress-v2-phase4-shadow --remote --config=wrangler.jsonc --command "UPDATE reviewer_credentials SET password_salt='Uzw39EBOqz26HkBuR8zfnQ',password_hash='z7Wwwc6xIbgm6qCQNBuya6RaPRv5heY3W9exb_Rweoc',password_iterations=310000,failed_attempts=0,locked_until=NULL,last_login_at=NULL,updated_at=CURRENT_TIMESTAMP WHERE username_normalized='razorpay-review';"
