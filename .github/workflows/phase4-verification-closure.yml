name: Phase 4 Verification Closure

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-operations-admin-platform
    paths:
      - .github/workflows/phase4-verification-closure.yml
      - scripts/phase5/verification-closure.mjs
      - tests/phase4-verification-closure.test.mjs
      - scripts/phase5/mutation-matrix.mjs
      - scripts/phase5/phase2-fixture-helpers.mjs
      - tests/phase3-mutation-matrix.test.mjs
      - app/api/community/**
      - app/api/admin/community/**
      - app/api/notes/**
      - app/api/resources/**
      - app/api/admin/resources/**
      - app/api/planner/**
      - app/api/progress/**
      - lib/data/d1/**
      - lib/community/**
      - lib/resources/**
      - lib/progress/**
      - lib/billing/**

permissions:
  contents: read

jobs:
  verification-closure:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 60
    env:
      SMOKE_MUTATION_AUTH_COOKIE: ${{ secrets.SMOKE_MUTATION_AUTH_COOKIE }}
      SMOKE_MODERATOR_AUTH_COOKIE: ${{ secrets.SMOKE_MODERATOR_AUTH_COOKIE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PHASE3_D1_DATABASE: ca-progress-v2-phase4-shadow
      PHASE4_EXPECTED_BRANCH: phase-12-operations-admin-platform
      SMOKE_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Phase 3 mutation contract
        run: node --test tests/phase3-mutation-matrix.test.mjs

      - name: Verify Phase 4 closure contract
        run: node --test tests/phase4-verification-closure.test.mjs

      - name: Run fresh live Phase 3 mutation/auth matrix
        run: node scripts/phase5/mutation-matrix.mjs

      - name: Evaluate Phase 4 verification closure
        if: always()
        run: node scripts/phase5/verification-closure.mjs

      - name: Upload Phase 4 evidence pack
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase4-verification-closure-${{ github.run_id }}
          path: |
            phase3-report/
            phase4-report/
          if-no-files-found: error
          retention-days: 30
