name: Phase 4 One-Shot Offer Verification v5

on:
  push:
    branches: [hotfix/dark-mode-ae0cb36d]
    paths:
      - .github/workflows/billing-phase4-one-shot-offer-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      CA_BILLING_PHASE4_MODE: audit
      CA_BILLING_PHASE4_PROVIDER_OFFER_ID: offer_TdKqQY3qURnoHt
      CA_BILLING_PHASE4_OFFER_ATTESTATION: DASHBOARD_CREATED_BY_ACCOUNT_OWNER
      CA_BILLING_PHASE4_EVIDENCE_PATH: deployment-evidence/billing-subscription-phase4-offer-verify.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Phase 4 contracts
        run: node --test tests/billing-subscription-repair-phase4.test.mjs
      - name: Verify production Offer and legacy candidates
        run: node scripts/repair-legacy-billing-phase4.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-phase4-offer-verify-${{ github.sha }}
          path: deployment-evidence/billing-subscription-phase4-offer-verify.json
          if-no-files-found: error
          retention-days: 30
