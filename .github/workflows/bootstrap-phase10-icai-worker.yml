name: Bootstrap Phase 10 Internal ICAI Worker

on:
  push:
    branches:
      - phase-10-community-v2
    paths:
      - .github/workflows/bootstrap-phase10-icai-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-internal-worker:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Deploy private ICAI sync Worker
        run: npm run cf:deploy:icai
