name: Build Notification Vault APK

on:
  push:
    branches:
      - tmp-notification-vault-apk-20260926

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: notification-vault-android

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 15 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint and build APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Prepare downloadable APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NotificationVault-android-debug.apk
          sha256sum NotificationVault-android-debug.apk > NotificationVault-android-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notification-vault-android-apk
          path: |
            notification-vault-android/NotificationVault-android-debug.apk
            notification-vault-android/NotificationVault-android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
