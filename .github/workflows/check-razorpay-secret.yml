name: Check Razorpay Key Secret Presence

on:
  push:
    branches: [phase-12-operations-admin-platform]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: v2-staging
    steps:
      - name: Check RAZORPAY_KEY_SECRET presence
        shell: bash
        env:
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          if [ -n "$RAZORPAY_KEY_SECRET" ]; then
            echo "RAZORPAY_KEY_SECRET_PRESENT=yes"
          else
            echo "RAZORPAY_KEY_SECRET_PRESENT=no"
          fi
