name: Live upload roundtrip certification
on:
  push:
    branches: [onboarding-design-phase7]
    paths:
      - scripts/resources/verify-live-upload-roundtrip.mjs
      - .github/workflows/resources-live-upload-check.yml
  pull_request:
    branches: [main]
    types: [synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resources-live-upload-certification
  cancel-in-progress: true
jobs:
  certify:
    if: github.event_name != 'pull_request' || (github.head_ref == 'onboarding-design-phase7' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Verify live signed-in three-part upload and cleanup
        run: node scripts/resources/verify-live-upload-roundtrip.mjs
