name: Product Consistency Phase 12 Certification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Cloudflare V2 Deploy"]
    types: [completed]
    branches: [phase-12-operations-admin-platform]

permissions:
  contents: read

concurrency:
  group: product-consistency-phase12-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_AUTH_COOKIE: ${{ secrets.SMOKE_AUTH_COOKIE }}
      DEPLOY_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Repository and Cloudflare certification
        run: npm run audit:product-consistency:phase12:production
      - name: Upload immutable certification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: product-consistency-phase12-${{ github.event.workflow_run.head_sha || github.sha }}
          retention-days: 90
          path: deployment-evidence/product-consistency-phase12.json
