name: Phase 1 Admin Live Verification

on:
  workflow_dispatch:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/phase1-admin-live-verification.yml
      - scripts/verify-admin-phase1-live.mjs
      - tests/admin-phase1-live.test.mjs
      - app/(admin)/admin/**
      - app/api/admin/**
      - lib/admin/**
      - lib/auth/**
      - lib/authorization/**
      - d1/migrations/0027_admin_phase1_security.sql

permissions:
  contents: read

concurrency:
  group: phase1-admin-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-admin-live:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
      PHASE1_D1_DATABASE: ca-progress-v2-phase4-shadow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify Phase 1 live-proof contract
        run: node --test tests/admin-phase1-live.test.mjs
      - name: Run authenticated Phase 1 production admin proof
        run: node scripts/verify-admin-phase1-live.mjs
      - name: Upload Phase 1 admin evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase1-admin-live-${{ github.run_id }}
          path: phase1-admin-evidence/
          if-no-files-found: error
          retention-days: 30
