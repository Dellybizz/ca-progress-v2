name: Billing Phase A Production Certification

on:
  workflow_dispatch:
    inputs:
      provider_subscription_id:
        description: "Live Razorpay subscription id (sub_...)"
        required: true
        type: string
      provider_payment_id:
        description: "Captured live Razorpay payment id (pay_...)"
        required: true
        type: string
      expected_amount_subunits:
        description: "Optional exact amount in paise, for example 5000 for ₹50"
        required: false
        type: string
      expected_plan_id:
        description: "Optional internal CA Progress plan id"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: billing-phase-a-production-${{ inputs.provider_subscription_id }}
  cancel-in-progress: false

jobs:
  certify:
    if: github.ref == 'refs/heads/hotfix/dark-mode-ae0cb36d'
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      CA_BILLING_CERT_SUBSCRIPTION_ID: ${{ inputs.provider_subscription_id }}
      CA_BILLING_CERT_PAYMENT_ID: ${{ inputs.provider_payment_id }}
      CA_BILLING_CERT_EXPECTED_AMOUNT_SUBUNITS: ${{ inputs.expected_amount_subunits }}
      CA_BILLING_CERT_EXPECTED_PLAN_ID: ${{ inputs.expected_plan_id }}
      CA_BILLING_CERT_EXPECTED_CURRENCY: INR
      CA_BILLING_CERT_EVIDENCE_PATH: deployment-evidence/billing-phase-a.json
    steps:
      - name: Check out exact certification SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Phase A certification contracts
        run: node --test tests/refinement-phase-a-billing-certification.test.mjs

      - name: Confirm production Billing Worker target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "ca-progress-v2-billing"' workers/billing/wrangler.jsonc
          grep -q '"main": "./p4-closure.ts"' workers/billing/wrangler.jsonc
          grep -q '"database_id": "6f002cbe-fe40-4d1b-9cf4-df6faaf52350"' workers/billing/wrangler.jsonc

      - name: Certify live Razorpay to D1 to entitlement flow
        run: node scripts/certify-billing-production.mjs

      - name: Upload sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-phase-a-${{ github.sha }}
          path: deployment-evidence/billing-phase-a.json
          if-no-files-found: error
          retention-days: 30
