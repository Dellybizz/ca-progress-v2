name: Temporary Phase 2 Reconstruction

on:
  push:
    branches: [phase2-reconstruct-20260909]
    paths:
      - scripts/__phase2_reconstruct.py
      - .github/workflows/__phase2-reconstruct.yml

permissions:
  contents: write

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase2-reconstruct-20260909
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply Phase 2 reconstruction
        run: python3 scripts/__phase2_reconstruct.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused ICAI verification
        run: npm run test:icai:phase5
      - name: Clean D1 double-migration verification
        run: npm run d1:hot-indexes:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full repository regression suite
        run: npm test
      - name: Commit verified Phase 2 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ca-progress-phase2-bot"
          git config user.email "ca-progress-phase2-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(icai): lock bootstrap and certify incremental sync"
          git push origin HEAD:phase2-reconstruct-20260909
