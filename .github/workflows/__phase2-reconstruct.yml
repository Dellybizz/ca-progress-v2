name: Temporary Phase 2 Reconstruction

on:
  push:
    branches: [phase2-reconstruct-20260909]
    paths:
      - scripts/__phase2_reconstruct.py
      - .github/workflows/__phase2-reconstruct.yml
      - tests/icai-resource-mapping-integrity.test.mjs
      - tests/phase8-engine.test.mjs

permissions:
  contents: write

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase2-reconstruct-20260909
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply Phase 2 reconstruction
        run: python3 scripts/__phase2_reconstruct.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full repository regression suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/npm-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo "Full repository regression failure diagnostic"
              echo "============================================"
              grep -nE 'not ok|AssertionError|ERR_ASSERTION|failureType|error:|expected:|actual:|tests? failed|fail [0-9]+' /tmp/npm-test.log | tail -240 || true
              echo
              echo "Last 220 lines"
              echo "=============="
              tail -220 /tmp/npm-test.log
            } > phase2-regression-failure.txt
            git config user.name "ca-progress-phase2-bot"
            git config user.email "ca-progress-phase2-bot@users.noreply.github.com"
            git add phase2-regression-failure.txt
            git commit -m "chore: capture phase2 regression diagnostic"
            git push origin HEAD:phase2-reconstruct-20260909
            exit "$result"
          fi
      - name: Focused ICAI verification
        run: npm run test:icai:phase5
      - name: Clean D1 double-migration verification
        run: npm run d1:hot-indexes:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Persist verified non-workflow Phase 2 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ca-progress-phase2-bot"
          git config user.email "ca-progress-phase2-bot@users.noreply.github.com"

          # The reconstruction script intentionally deletes its temporary helper and
          # workflow. Restore those two staging files here so this Actions token never
          # attempts a workflow-file write; they are removed later through the connected
          # GitHub API, which has the required repository permission.
          git checkout -- scripts/__phase2_reconstruct.py .github/workflows/__phase2-reconstruct.yml

          # deploy-staging.yml is the only real Phase 2 workflow edit. Leave it for the
          # connected GitHub API for the same workflow-permission reason.
          git checkout -- .github/workflows/deploy-staging.yml

          # Never persist local build/install artifacts from the verification runner.
          rm -f package-lock.json tsconfig.tsbuildinfo phase2-regression-failure.txt

          git add -A
          git diff --cached --check
          git commit -m "feat(icai): lock bootstrap and incremental state"
          git push origin HEAD:phase2-reconstruct-20260909
