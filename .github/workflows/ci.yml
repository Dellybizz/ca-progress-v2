name: V2 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Cloudflare migration Phase 2 contract tests
        run: npm run test:cloudflare-phase2
      - name: Cloudflare migration Phase 2 clean D1 bootstrap
        run: npm run d1:phase2:validate
      - name: Next.js production build
        run: npm run build
      - name: OpenNext Worker build and Wrangler dry-runs
        run: npm run cf:check
      - name: Smoke Cloudflare SSR routes
        run: npm run cf:smoke
      - name: Repository-wide tests
        run: npm test
