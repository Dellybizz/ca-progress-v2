name: Authentication Phase 4 Account Security

on:
  push:
    branches: [auth-phase4-security]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-phase4-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CA_AUTH_SESSION_SECRET: ${{ secrets.CA_AUTH_SESSION_SECRET }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      LINKEDIN_OIDC_CLIENT_ID: ${{ secrets.LINKEDIN_OIDC_CLIENT_ID }}
      LINKEDIN_OIDC_CLIENT_SECRET: ${{ secrets.LINKEDIN_OIDC_CLIENT_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_NAME: CA Progress
      NEXT_PUBLIC_APP_VERSION: cloudflare-retired
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify code and build
        run: npm run ci
      - name: Verify native app bundle
        run: npm run native:bundle
      - name: Build Cloudflare runtime
        run: npm run cf:build
      - name: Deploy web runtime
        run: npm run cf:deploy:web
      - name: Confirm account setup and username login are available
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://ca-progress-v2.habeebaasif622.workers.dev/api/v1/account-setup)
          test "$status" = "401"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://ca-progress-v2.habeebaasif622.workers.dev/api/v1/password-auth)
          test "$status" != "404"

  android-debug:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci --no-audit --no-fund
      - run: npm run native:build:android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: ca-progress-auth-phase4-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
