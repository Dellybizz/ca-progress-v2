name: Cloudflare Migration Phase 5 Final Delta

on:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/phase5-final-delta.yml

permissions:
  contents: read

env:
  PHASE4_D1_NAME: ca-progress-v2-phase4-shadow
  PHASE4_R2_BUCKET: ca-progress-v2-staging-user-resources
  PHASE4_RUN_ID: phase5-final-delta-v1

jobs:
  final-delta:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Pre-cutover TypeScript gate
        run: npm run typecheck
      - name: Pre-cutover lint gate
        run: npm run lint
      - name: Re-prove Phase 4 migration invariants
        run: |
          npm run test:cloudflare-phase4
          npm run d1:phase4:validate
      - name: Create sanitized final Supabase logical backup
        run: node scripts/phase5/final-backup.mjs
      - name: Apply final production delta and full reconciliation
        run: node scripts/phase4/production-shadow.mjs
      - name: Promote reconciliation report to Phase 5 evidence
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('phase4-report.json', 'utf8'));
          const backup = JSON.parse(readFileSync('phase5-backup/manifest.json', 'utf8'));
          report.phase = 5;
          report.mode = 'final-delta-reconciliation';
          report.phase4BaselineRunId = 'phase4-production-shadow-v1';
          report.phase5RunId = process.env.PHASE4_RUN_ID;
          report.finalBackup = backup;
          report.cutoverCandidate = report.status === 'reconciled' && report.failures.length === 0 && report.discrepancies.length === 0 && report.foreignKeyViolations === 0;
          writeFileSync('phase5-report.json', JSON.stringify(report, null, 2));
          if (!report.cutoverCandidate) process.exit(1);
          EOF
      - name: Upload final backup and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-final-delta-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            phase5-backup/
            phase4-report.json
            phase5-report.json
