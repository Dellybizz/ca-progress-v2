name: Part 1 ICAI Continuation Patch

on:
  push:
    branches: [phase-12-operations-admin-platform]
    paths: [.github/workflows/part1-icai-continuation-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-12-operations-admin-platform
          fetch-depth: 0
      - name: Apply production-safe ICAI continuation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          migration = '''-- ICAI sync production continuation: durable per-run/source state.
          PRAGMA foreign_keys = ON;

          CREATE TABLE IF NOT EXISTS icai_sync_source_states (
            run_id TEXT NOT NULL REFERENCES icai_sync_runs(id) ON DELETE CASCADE,
            source_id TEXT NOT NULL REFERENCES icai_sources(id) ON DELETE CASCADE,
            source_index INTEGER NOT NULL CHECK(source_index >= 0),
            status TEXT NOT NULL DEFAULT 'pending' CHECK(status IN ('pending','running','succeeded','failed','skipped','cancelled')),
            attempts INTEGER NOT NULL DEFAULT 0 CHECK(attempts >= 0),
            started_at TEXT,
            finished_at TEXT,
            last_error TEXT,
            updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY(run_id, source_id),
            UNIQUE(run_id, source_index)
          );
          CREATE INDEX IF NOT EXISTS icai_sync_source_states_run_status_idx
            ON icai_sync_source_states(run_id, status, source_index);

          INSERT OR IGNORE INTO _ca_schema_migrations(version,description,source_freeze_commit)
          VALUES ('0028','bounded sequential ICAI queue continuation source state','phase-12-operations-admin-platform');
          '''
          Path('d1/migrations/0028_icai_sync_continuation.sql').write_text(migration)

          continuation = r'''
          export type IcaiSyncContinuationStart = {
            runId: string;
            sourceIds: string[];
          };

          export type IcaiSyncContinuationSourceResult = {
            runId: string;
            sourceId: string;
            status: "succeeded" | "failed" | "skipped" | "cancelled";
            requestIntervalSeconds: number;
            alreadyComplete: boolean;
          };

          function parseDetails(value: unknown): Record<string, unknown> {
            if (value && typeof value === "object" && !Array.isArray(value)) return value as Record<string, unknown>;
            if (typeof value === "string") {
              try {
                const parsed = JSON.parse(value) as unknown;
                return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed as Record<string, unknown> : {};
              } catch { return {}; }
            }
            return {};
          }

          async function ensureContinuationSourceStates(runtime: IcaiSyncRuntime, runId: string, sourceIds: string[]) {
            if (!sourceIds.length) return;
            await runtime.db.batch(sourceIds.map((sourceId, sourceIndex) =>
              runtime.db.prepare("INSERT OR IGNORE INTO icai_sync_source_states(run_id,source_id,source_index,status,attempts,updated_at) VALUES(?1,?2,?3,'pending',0,CURRENT_TIMESTAMP)")
                .bind(runId, sourceId, sourceIndex)
            ));
          }

          async function continuationSources(client: AdminClient) {
            const response = await client.from("icai_sources").select("*").eq("is_active", true).order("id");
            if (response.error) throw response.error;
            const sources = ((response.data ?? []) as SourceRow[]).map(sourceDto);
            if (!sources.length) throw new Error("No active ICAI sources are configured.");
            return sources;
          }

          export async function startIcaiSyncContinuationEngine(
            runtime: IcaiSyncRuntime,
            { trigger, requestedBy = null, orchestrationKey }: {
              trigger: "cron" | "manual" | "test";
              requestedBy?: string | null;
              orchestrationKey: string;
            },
          ): Promise<IcaiSyncContinuationStart> {
            if (!runtime.enabled) throw new Error("ICAI synchronization is disabled for this environment.");
            await recoverStaleRuns(runtime.db);
            const client = adminClient(runtime);
            const sources = await continuationSources(client);
            const sourceIds = sources.map((source) => source.id);

            const active = await runtime.db.prepare("SELECT id,details FROM icai_sync_runs WHERE status IN ('queued','running') ORDER BY started_at DESC LIMIT 1")
              .first<{ id: string; details: unknown }>();
            if (active) {
              const details = parseDetails(active.details);
              if (details.orchestration_key === orchestrationKey) {
                const storedSourceIds = stringArray(details.source_ids);
                const effectiveSourceIds = storedSourceIds.length ? storedSourceIds : sourceIds;
                await ensureContinuationSourceStates(runtime, active.id, effectiveSourceIds);
                return { runId: active.id, sourceIds: effectiveSourceIds };
              }
              throw new IcaiSyncAlreadyRunningError();
            }

            const runId = crypto.randomUUID();
            const startedAt = new Date().toISOString();
            const details = JSON.stringify({
              engine: "phase8",
              execution: "queue_continuation",
              persistence: "cloudflare-d1",
              orchestration_key: orchestrationKey,
              source_ids: sourceIds,
            });
            const inserted = await runtime.db.prepare("INSERT INTO icai_sync_runs(id,trigger_type,requested_by,parser_version,status,started_at,source_total,details) SELECT ?1,?2,?3,?4,'running',?5,?6,?7 WHERE NOT EXISTS (SELECT 1 FROM icai_sync_runs WHERE status IN ('queued','running')) RETURNING id")
              .bind(runId, trigger, requestedBy, PARSER_VERSION, startedAt, sourceIds.length, details)
              .first<{ id: string }>();
            if (!inserted) {
              const retryActive = await runtime.db.prepare("SELECT id,details FROM icai_sync_runs WHERE status IN ('queued','running') ORDER BY started_at DESC LIMIT 1")
                .first<{ id: string; details: unknown }>();
              const retryDetails = parseDetails(retryActive?.details);
              if (retryActive && retryDetails.orchestration_key === orchestrationKey) {
                const storedSourceIds = stringArray(retryDetails.source_ids);
                const effectiveSourceIds = storedSourceIds.length ? storedSourceIds : sourceIds;
                await ensureContinuationSourceStates(runtime, retryActive.id, effectiveSourceIds);
                return { runId: retryActive.id, sourceIds: effectiveSourceIds };
              }
              throw new IcaiSyncAlreadyRunningError();
            }
            await ensureContinuationSourceStates(runtime, runId, sourceIds);
            await initializeRuntime(runtime.db, runId);
            return { runId, sourceIds };
          }

          export async function runIcaiSyncContinuationSource(
            runtime: IcaiSyncRuntime,
            { runId, sourceId }: { runId: string; sourceId: string },
          ): Promise<IcaiSyncContinuationSourceResult> {
            if (!runtime.enabled) throw new Error("ICAI synchronization is disabled for this environment.");
            const client = adminClient(runtime);
            const [sourceResponse, levelResponse, subjectResponse, attemptResponse] = await Promise.all([
              client.from("icai_sources").select("*").eq("id", sourceId).eq("is_active", true).single(),
              client.from("course_levels").select("*").eq("is_active", true),
              client.from("subjects").select("*").eq("is_active", true),
              client.from("exam_attempts").select("*").eq("verification_status", "verified"),
            ]);
            const firstError = [sourceResponse.error, levelResponse.error, subjectResponse.error, attemptResponse.error].find(Boolean);
            if (firstError) throw firstError;
            if (!sourceResponse.data) throw new Error(`ICAI source ${sourceId} is not active or does not exist.`);
            const source = sourceDto(sourceResponse.data as SourceRow);
            const state = await runtime.db.prepare("SELECT status FROM icai_sync_source_states WHERE run_id=?1 AND source_id=?2 LIMIT 1")
              .bind(runId, sourceId).first<{ status: string }>();
            if (!state) throw new Error(`ICAI continuation source state is missing for ${sourceId}.`);
            if (["succeeded", "failed", "skipped", "cancelled"].includes(state.status)) {
              return {
                runId,
                sourceId,
                status: state.status as IcaiSyncContinuationSourceResult["status"],
                requestIntervalSeconds: source.requestIntervalSeconds,
                alreadyComplete: true,
              };
            }
            const run = await runtime.db.prepare("SELECT status FROM icai_sync_runs WHERE id=?1 LIMIT 1").bind(runId).first<{ status: string }>();
            if (!run) throw new Error(`ICAI sync run ${runId} does not exist.`);
            if (run.status === "cancelled") {
              await runtime.db.prepare("UPDATE icai_sync_source_states SET status='cancelled',finished_at=CURRENT_TIMESTAMP,updated_at=CURRENT_TIMESTAMP WHERE run_id=?1 AND source_id=?2").bind(runId, sourceId).run();
              return { runId, sourceId, status: "cancelled", requestIntervalSeconds: source.requestIntervalSeconds, alreadyComplete: false };
            }
            if (run.status !== "running") throw new Error(`ICAI sync run ${runId} is not running (status=${run.status}).`);
            await runtime.db.prepare("UPDATE icai_sync_source_states SET status='running',attempts=attempts+1,started_at=COALESCE(started_at,CURRENT_TIMESTAMP),last_error=NULL,updated_at=CURRENT_TIMESTAMP WHERE run_id=?1 AND source_id=?2")
              .bind(runId, sourceId).run();
            try {
              await processSource(
                client,
                runtime,
                runId,
                source,
                (levelResponse.data ?? []) as LevelRow[],
                (subjectResponse.data ?? []) as SubjectRow[],
                (attemptResponse.data ?? []) as AttemptRow[],
              );
              await runtime.db.prepare("UPDATE icai_sync_source_states SET status='succeeded',finished_at=CURRENT_TIMESTAMP,last_error=NULL,updated_at=CURRENT_TIMESTAMP WHERE run_id=?1 AND source_id=?2")
                .bind(runId, sourceId).run();
              return { runId, sourceId, status: "succeeded", requestIntervalSeconds: source.requestIntervalSeconds, alreadyComplete: false };
            } catch (error) {
              if (error instanceof SyncCancelledError) {
                const message = asErrorMessage(error).slice(0, 2000);
                await runtime.db.batch([
                  runtime.db.prepare("UPDATE icai_sync_runs SET status='cancelled',completed_at=CURRENT_TIMESTAMP,error_summary=?1 WHERE id=?2").bind(message, runId),
                  runtime.db.prepare("UPDATE icai_sync_source_states SET status='cancelled',finished_at=CURRENT_TIMESTAMP,last_error=?1,updated_at=CURRENT_TIMESTAMP WHERE run_id=?2 AND source_id=?3").bind(message, runId, sourceId),
                ]);
                await setStage(runtime.db, runId, "cancelled");
                return { runId, sourceId, status: "cancelled", requestIntervalSeconds: source.requestIntervalSeconds, alreadyComplete: false };
              }
              const skipped = error instanceof SyncSourceSkippedError;
              const message = skipped
                ? "Skipped by an administrator. Last verified data was preserved."
                : asErrorMessage(error);
              const { error: failureError } = await client.rpc("icai_sync_mark_source_failure", {
                p_run_id: runId,
                p_source_id: source.id,
                p_error: message,
              });
              if (failureError) throw failureError;
              await runtime.db.prepare("UPDATE icai_sync_source_states SET status=?1,finished_at=CURRENT_TIMESTAMP,last_error=?2,updated_at=CURRENT_TIMESTAMP WHERE run_id=?3 AND source_id=?4")
                .bind(skipped ? "skipped" : "failed", message.slice(0, 2000), runId, sourceId).run();
              return { runId, sourceId, status: skipped ? "skipped" : "failed", requestIntervalSeconds: source.requestIntervalSeconds, alreadyComplete: false };
            }
          }

          function summaryFromRun(runId: string, result: RunRow, status: IcaiSyncSummary["status"]): IcaiSyncSummary {
            return {
              runId,
              status,
              sourceTotal: Number(result.source_total),
              sourceSucceeded: Number(result.source_succeeded),
              sourceFailed: Number(result.source_failed),
              newItems: Number(result.new_items),
              changedItems: Number(result.changed_items),
              unchangedItems: Number(result.unchanged_items),
              removedItems: Number(result.removed_items),
              pendingReviews: Number(result.pending_reviews),
            };
          }

          export async function finalizeIcaiSyncContinuationEngine(
            runtime: IcaiSyncRuntime,
            { runId }: { runId: string },
          ): Promise<IcaiSyncSummary> {
            const client = adminClient(runtime);
            const incomplete = await runtime.db.prepare("SELECT COUNT(*) AS count FROM icai_sync_source_states WHERE run_id=?1 AND status IN ('pending','running')")
              .bind(runId).first<{ count: number }>();
            if (Number(incomplete?.count ?? 0) > 0) throw new Error("ICAI continuation cannot finalize while source work is still pending.");
            const { data: finalRun, error: finalReadError } = await client.from("icai_sync_runs").select("*").eq("id", runId).single();
            if (finalReadError || !finalRun) throw finalReadError ?? new Error("Could not finalize ICAI sync run.");
            const row = finalRun as unknown as RunRow & { status?: string };
            if (row.status === "success" || row.status === "partial" || row.status === "failed") {
              return summaryFromRun(runId, row, row.status);
            }
            if (row.status === "cancelled") throw new SyncCancelledError();
            await setStage(runtime.db, runId, "finalizing");
            await checkpoint(runtime.db, runId);
            const status: IcaiSyncSummary["status"] = row.source_failed === 0
              ? "success"
              : row.source_succeeded > 0
                ? "partial"
                : "failed";
            const { error: finishError } = await client.from("icai_sync_runs")
              .update({ status, completed_at: new Date().toISOString() }).eq("id", runId);
            if (finishError) throw finishError;
            await setStage(runtime.db, runId, status === "success" ? "completed" : status);
            return summaryFromRun(runId, row, status);
          }

          '''
          replace(
              'workers/icai-sync/sync-engine.ts',
              'export async function runIcaiSyncEngine(',
              continuation + 'export async function runIcaiSyncEngine('
          )

          Path('workers/icai-sync/index.ts').write_text(r'''import {
            IcaiSyncAlreadyRunningError,
            finalizeIcaiSyncContinuationEngine,
            runIcaiSyncContinuationSource,
            runIcaiSyncEngine,
            startIcaiSyncContinuationEngine,
          } from "./sync-engine";
          import type { D1Database } from "./d1-client";

          type Env = { DB?: D1Database };
          type SyncRequest = { trigger?: unknown; requestedBy?: unknown; orchestrationKey?: unknown; runId?: unknown; sourceId?: unknown };
          const INTERNAL_MARKER = "ca-progress-v2-web";
          function json(data:unknown,status=200){return new Response(JSON.stringify(data),{status,headers:{"Content-Type":"application/json; charset=utf-8","Cache-Control":"private, no-store"}});}
          function runtime(request: Request, db: D1Database) {
            return {
              db,
              userAgent: request.headers.get("x-ca-progress-icai-user-agent")?.trim()||"CA Progress V2 Official ICAI Monitor/phase8",
              enabled: request.headers.get("x-ca-progress-icai-enabled")!=="false",
            };
          }
          function boundedString(value: unknown, max = 200) { return typeof value === "string" && value.length > 0 && value.length <= max ? value : null; }

          const icaiSyncWorker = {
            async fetch(request:Request,env:Env){
              const url=new URL(request.url);
              if(request.method==="GET"&&url.pathname==="/health"){
                if(request.headers.get("x-ca-progress-internal")!==INTERNAL_MARKER)return json({ok:false,error:"Internal service request required."},403);
                return json({ok:true,databaseConfigured:Boolean(env.DB),persistence:"cloudflare-d1"});
              }
              if(request.method!=="POST"||!["/run","/start","/source","/finalize"].includes(url.pathname))return json({ok:false,error:"Not found."},404);
              if(request.headers.get("x-ca-progress-internal")!==INTERNAL_MARKER)return json({ok:false,error:"Internal service request required."},403);
              if(!env.DB)return json({ok:false,error:"Internal D1 sync runtime is not configured."},503);
              const body=await request.json().catch(()=>null) as SyncRequest|null;
              const config=runtime(request,env.DB);
              try{
                if(url.pathname==="/source"){
                  const runId=boundedString(body?.runId);
                  const sourceId=boundedString(body?.sourceId);
                  if(!runId||!sourceId)return json({ok:false,error:"runId and sourceId are required."},400);
                  const result=await runIcaiSyncContinuationSource(config,{runId,sourceId});
                  return json({ok:true,result});
                }
                if(url.pathname==="/finalize"){
                  const runId=boundedString(body?.runId);
                  if(!runId)return json({ok:false,error:"runId is required."},400);
                  const summary=await finalizeIcaiSyncContinuationEngine(config,{runId});
                  return json({ok:true,summary});
                }
                const trigger=body?.trigger;
                if(trigger!=="cron"&&trigger!=="manual"&&trigger!=="test")return json({ok:false,error:"Invalid sync trigger."},400);
                const requestedBy=typeof body?.requestedBy==="string"&&body.requestedBy.length<=200?body.requestedBy:null;
                if(url.pathname==="/start"){
                  const orchestrationKey=boundedString(body?.orchestrationKey,180);
                  if(!orchestrationKey)return json({ok:false,error:"orchestrationKey is required."},400);
                  const result=await startIcaiSyncContinuationEngine(config,{trigger,requestedBy,orchestrationKey});
                  return json({ok:true,result});
                }
                const summary=await runIcaiSyncEngine(config,{trigger,requestedBy});
                return json({ok:true,summary});
              }
              catch(error){if(error instanceof IcaiSyncAlreadyRunningError)return json({ok:false,error:error.message},409);return json({ok:false,error:error instanceof Error?error.message:"ICAI synchronization failed."},500);}
            },
          };

          export default icaiSyncWorker;
          ''')

          Path('lib/icai/sync.ts').write_text(r'''import "server-only";

          import { getCloudflareContext } from "@opennextjs/cloudflare";
          import { getIcaiSyncConfig } from "@/lib/env";
          import type { IcaiSyncSummary } from "./types";
          import { invalidateSharedPublicCache } from "@/lib/cache/public";

          type IcaiSyncService = { fetch(request: Request): Promise<Response> };
          export type IcaiSyncContinuationStart = { runId: string; sourceIds: string[] };
          export type IcaiSyncContinuationSourceResult = { runId:string;sourceId:string;status:"succeeded"|"failed"|"skipped"|"cancelled";requestIntervalSeconds:number;alreadyComplete:boolean };
          type SyncPayload<T = unknown> = { ok?: boolean; result?: T; summary?: IcaiSyncSummary; error?: string };

          function getService():IcaiSyncService{try{const{env}=getCloudflareContext();const service=(env as unknown as Record<string,unknown>).ICAI_SYNC_SERVICE as IcaiSyncService|undefined;if(service&&typeof service.fetch==="function")return service;}catch{}throw new Error("ICAI sync service binding is unavailable. Use the Cloudflare multi-Worker runtime for sync operations.");}
          async function request<T>(path:string,body:Record<string,unknown>):Promise<SyncPayload<T>>{const sync=getIcaiSyncConfig();if(!sync.enabled)throw new Error("ICAI synchronization is disabled for this environment.");const response=await getService().fetch(new Request(`https://icai-sync.internal${path}`,{method:"POST",headers:{"content-type":"application/json","x-ca-progress-internal":"ca-progress-v2-web","x-ca-progress-icai-user-agent":sync.userAgent,"x-ca-progress-icai-enabled":String(sync.enabled)},body:JSON.stringify(body)}));const text=await response.text();let payload:SyncPayload<T>={};if(text){try{payload=JSON.parse(text) as SyncPayload<T>;}catch{payload={};}}if(!response.ok||!payload.ok)throw new Error(payload.error||`ICAI sync service failed (${response.status}).`);return payload;}

          export async function runIcaiSync({trigger,requestedBy=null}:{trigger:"cron"|"manual"|"test";requestedBy?:string|null}):Promise<IcaiSyncSummary>{const payload=await request("/run",{trigger,requestedBy});if(!payload.summary)throw new Error("ICAI sync service returned no summary.");await invalidateSharedPublicCache(["icai"]);return payload.summary;}
          export async function startIcaiSyncContinuation({trigger,requestedBy=null,orchestrationKey}:{trigger:"cron"|"manual"|"test";requestedBy?:string|null;orchestrationKey:string}):Promise<IcaiSyncContinuationStart>{const payload=await request<IcaiSyncContinuationStart>("/start",{trigger,requestedBy,orchestrationKey});if(!payload.result)throw new Error("ICAI sync service returned no continuation start result.");return payload.result;}
          export async function runIcaiSyncSource({runId,sourceId}:{runId:string;sourceId:string}):Promise<IcaiSyncContinuationSourceResult>{const payload=await request<IcaiSyncContinuationSourceResult>("/source",{runId,sourceId});if(!payload.result)throw new Error("ICAI sync service returned no source result.");return payload.result;}
          export async function finalizeIcaiSyncContinuation({runId}:{runId:string}):Promise<IcaiSyncSummary>{const payload=await request("/finalize",{runId});if(!payload.summary)throw new Error("ICAI sync service returned no continuation summary.");await invalidateSharedPublicCache(["icai"]);return payload.summary;}
          ''')

          Path('lib/jobs/queue.ts').write_text(r'''import "server-only";

          import { getCloudflareContext } from "@opennextjs/cloudflare";

          export type BackgroundJobType =
            | "icai-sync"
            | "icai-phase5-review-probe"
            | "notification-fanout"
            | "analytics-aggregate"
            | "attachment-process"
            | "cleanup"
            | "ai-plan-generation";

          export type BackgroundJob = {
            id: string;
            type: BackgroundJobType;
            idempotencyKey: string;
            payload: Record<string, unknown>;
            createdBy?: string | null;
          };

          type QueueProducer = { send(body: BackgroundJob, options?: { delaySeconds?: number }): Promise<void> };

          function producer(): QueueProducer | null {
            try {
              const { env } = getCloudflareContext();
              const value = (env as unknown as Record<string, unknown>).BACKGROUND_JOBS as QueueProducer | undefined;
              return value && typeof value.send === "function" ? value : null;
            } catch {
              return null;
            }
          }

          export async function enqueueBackgroundJob(input: {
            type: BackgroundJobType;
            idempotencyKey: string;
            payload?: Record<string, unknown>;
            createdBy?: string | null;
            delaySeconds?: number;
          }) {
            const job: BackgroundJob = {
              id: crypto.randomUUID(),
              type: input.type,
              idempotencyKey: input.idempotencyKey.slice(0, 180),
              payload: input.payload ?? {},
              createdBy: input.createdBy ?? null,
            };
            const queue = producer();
            if (!queue) throw new Error("Background job queue is unavailable.");
            const delaySeconds = input.delaySeconds == null ? undefined : Math.max(0, Math.min(86_400, Math.trunc(input.delaySeconds)));
            await queue.send(job, delaySeconds == null ? undefined : { delaySeconds });
            return job;
          }

          export function jobKey(type: BackgroundJobType, scope: string, value: string) {
            return `${type}:${scope}:${value}`.slice(0, 180);
          }
          ''')

          replace(
              'lib/jobs/execute.ts',
              'import { runIcaiSync } from "@/lib/icai/sync";',
              'import { finalizeIcaiSyncContinuation, runIcaiSyncSource, startIcaiSyncContinuation } from "@/lib/icai/sync";'
          )
          replace(
              'lib/jobs/execute.ts',
              'import type { BackgroundJob } from "./queue";',
              'import { enqueueBackgroundJob, type BackgroundJob } from "./queue";'
          )
          old_case = '''    case "icai-sync":\n      return runIcaiSync({\n        trigger: job.payload.trigger === "manual" ? "manual" : "cron",\n        requestedBy: typeof job.payload.requestedBy === "string" ? job.payload.requestedBy : null,\n      });'''
          new_case = '''    case "icai-sync": {\n      const mode = job.payload.mode;\n      if (mode === "source") {\n        const runId = typeof job.payload.runId === "string" ? job.payload.runId : null;\n        const sourceIds = Array.isArray(job.payload.sourceIds) ? job.payload.sourceIds.filter((value): value is string => typeof value === "string") : [];\n        const sourceIndex = Number(job.payload.sourceIndex);\n        if (!runId || !Number.isInteger(sourceIndex) || sourceIndex < 0 || sourceIndex >= sourceIds.length) throw new Error("Invalid ICAI source continuation payload.");\n        const sourceId = sourceIds[sourceIndex];\n        const result = await runIcaiSyncSource({ runId, sourceId });\n        if (result.status === "cancelled") return result;\n        const nextIndex = sourceIndex + 1;\n        if (nextIndex < sourceIds.length) {\n          const nextSourceId = sourceIds[nextIndex];\n          await enqueueBackgroundJob({\n            type: "icai-sync",\n            idempotencyKey: `icai-sync-source:${runId}:${nextIndex}:${nextSourceId}`,\n            payload: { ...job.payload, mode: "source", runId, sourceIds, sourceIndex: nextIndex },\n            createdBy: job.createdBy ?? null,\n            delaySeconds: result.requestIntervalSeconds,\n          });\n          return { ...result, nextSourceId };\n        }\n        const summary = await finalizeIcaiSyncContinuation({ runId });\n        return { ...result, summary };\n      }\n      const trigger = job.payload.trigger === "manual" ? "manual" : job.payload.trigger === "test" ? "test" : "cron";\n      const requestedBy = typeof job.payload.requestedBy === "string" ? job.payload.requestedBy : null;\n      const started = await startIcaiSyncContinuation({ trigger, requestedBy, orchestrationKey: job.idempotencyKey });\n      const firstSourceId = started.sourceIds[0];\n      if (!firstSourceId) throw new Error("ICAI continuation returned no active sources.");\n      await enqueueBackgroundJob({\n        type: "icai-sync",\n        idempotencyKey: `icai-sync-source:${started.runId}:0:${firstSourceId}`,\n        payload: { ...job.payload, mode: "source", runId: started.runId, sourceIds: started.sourceIds, sourceIndex: 0 },\n        createdBy: job.createdBy ?? null,\n      });\n      return started;\n    }'''
          replace('lib/jobs/execute.ts', old_case, new_case)

          live_path = Path('scripts/verify-icai-phase5-live.mjs')
          live = live_path.read_text()
          anchor = '''async function waitForJobs(keys) {\n  for (let attempt = 0; attempt < JOB_POLL_ATTEMPTS; attempt += 1) {\n    const rows = d1(`SELECT idempotency_key,status,attempts,last_error,started_at,finished_at FROM background_jobs WHERE idempotency_key IN (${keys.map(sqlText).join(",")}) ORDER BY idempotency_key;`);\n    writeFileSync(`${evidenceDir}/icai-phase5-background-jobs.json`, JSON.stringify(rows, null, 2));\n    const terminalFailure = rows.find((row) => row.status === "dead_letter");\n    if (terminalFailure) throw new Error(`Phase 5 queue job dead-lettered: ${terminalFailure.idempotency_key}: ${terminalFailure.last_error ?? "unknown error"}`);\n    if (rows.length === keys.length && rows.every((row) => row.status === "succeeded")) return rows;\n    await sleep(JOB_POLL_INTERVAL_MS);\n  }\n  throw new Error(`Phase 5 queue jobs did not both reach succeeded state within ${(JOB_POLL_ATTEMPTS * JOB_POLL_INTERVAL_MS) / 1000} seconds.`);\n}\n'''
          if anchor not in live:
              raise SystemExit('waitForJobs anchor missing')
          wait_run = anchor + '''\nasync function waitForIcaiContinuation(startedAt) {\n  for (let attempt = 0; attempt < JOB_POLL_ATTEMPTS; attempt += 1) {\n    const realRuns = d1(`SELECT id,status,trigger_type,parser_version,started_at,completed_at,source_total,source_succeeded,source_failed,new_items,changed_items,unchanged_items,removed_items,pending_reviews,error_summary FROM icai_sync_runs WHERE trigger_type='manual' AND parser_version='phase8.1' AND started_at >= ${sqlText(startedAt)} ORDER BY started_at DESC LIMIT 1;`);\n    const realRun = realRuns[0];\n    if (realRun) {\n      const childJobs = d1(`SELECT idempotency_key,status,attempts,last_error,payload_json,started_at,finished_at FROM background_jobs WHERE job_type='icai-sync' AND json_extract(payload_json,'$.mode')='source' AND json_extract(payload_json,'$.runId')=${sqlText(realRun.id)} ORDER BY idempotency_key;`);\n      writeFileSync(`${evidenceDir}/icai-phase5-source-jobs.json`, JSON.stringify(childJobs, null, 2));\n      const deadLetter = childJobs.find((row) => row.status === "dead_letter");\n      if (deadLetter) throw new Error(`Phase 5 ICAI source continuation dead-lettered: ${deadLetter.idempotency_key}: ${deadLetter.last_error ?? "unknown error"}`);\n      if (["failed", "cancelled"].includes(realRun.status)) throw new Error(`Phase 5 real ICAI continuation ended ${realRun.status}: ${realRun.error_summary ?? "unknown error"}`);\n      const sourceTotal = Number(realRun.source_total);\n      if (["success", "partial"].includes(realRun.status) && childJobs.length === sourceTotal && childJobs.every((row) => row.status === "succeeded")) {\n        const sourceStates = d1(`SELECT source_id,source_index,status,attempts,last_error,started_at,finished_at FROM icai_sync_source_states WHERE run_id=${sqlText(realRun.id)} ORDER BY source_index;`);\n        writeFileSync(`${evidenceDir}/icai-phase5-source-states.json`, JSON.stringify(sourceStates, null, 2));\n        if (sourceStates.length !== sourceTotal || sourceStates.some((row) => !["succeeded", "failed", "skipped"].includes(row.status))) throw new Error("Phase 5 continuation source states are incomplete.");\n        return { realRun, childJobs, sourceStates };\n      }\n    }\n    await sleep(JOB_POLL_INTERVAL_MS);\n  }\n  throw new Error(`Phase 5 ICAI continuation did not reach a verified terminal state within ${(JOB_POLL_ATTEMPTS * JOB_POLL_INTERVAL_MS) / 1000} seconds.`);\n}\n'''
          live = live.replace(anchor, wait_run, 1)
          old_real = '''await waitForJobs([reviewKey, syncKey]);\n\nconst realRuns = d1(`SELECT id,status,trigger_type,parser_version,started_at,completed_at,source_total,source_succeeded,source_failed,new_items,changed_items,unchanged_items,removed_items,pending_reviews,error_summary FROM icai_sync_runs WHERE trigger_type='manual' AND parser_version='phase8.1' AND started_at >= ${sqlText(startedAt)} ORDER BY started_at DESC LIMIT 1;`);\nconst realRun = realRuns[0];\nif (!realRun) throw new Error("Phase 5 could not find the queue-triggered ICAI sync run in D1.");\nif (!["success", "partial"].includes(realRun.status) || Number(realRun.source_succeeded) < 1) {\n  throw new Error(`Phase 5 real ICAI sync did not verify an official source: status=${realRun.status}, succeeded=${realRun.source_succeeded}, failed=${realRun.source_failed}.`);\n}\nwriteFileSync(`${evidenceDir}/icai-phase5-real-run.json`, JSON.stringify(realRun, null, 2));'''
          new_real = '''await waitForJobs([reviewKey, syncKey]);\nconst { realRun, childJobs } = await waitForIcaiContinuation(startedAt);\nif (Number(realRun.source_succeeded) < 1) {\n  throw new Error(`Phase 5 real ICAI sync did not verify an official source: status=${realRun.status}, succeeded=${realRun.source_succeeded}, failed=${realRun.source_failed}.`);\n}\nif (childJobs.length !== Number(realRun.source_total)) throw new Error("Phase 5 did not persist exactly one bounded source job per configured source.");\nwriteFileSync(`${evidenceDir}/icai-phase5-real-run.json`, JSON.stringify(realRun, null, 2));'''
          if old_real not in live:
              raise SystemExit('real run anchor missing')
          live = live.replace(old_real, new_real, 1)
          live_path.write_text(live)

          phase5 = Path('tests/icai-sync-phase5.test.mjs')
          tests = phase5.read_text()
          tests += r'''

          test("Phase 5 queue sync is bounded into sequential per-source continuation jobs", () => {
            const execute = read("lib/jobs/execute.ts");
            const queue = read("lib/jobs/queue.ts");
            const engine = read("workers/icai-sync/sync-engine.ts");
            const service = read("workers/icai-sync/index.ts");
            const migration = read("d1/migrations/0028_icai_sync_continuation.sql");
            const live = read("scripts/verify-icai-phase5-live.mjs");
            assert.match(execute, /mode === "source"/);
            assert.match(execute, /startIcaiSyncContinuation/);
            assert.match(execute, /runIcaiSyncSource/);
            assert.match(execute, /finalizeIcaiSyncContinuation/);
            assert.match(execute, /icai-sync-source:\$\{started\.runId\}:0:/);
            assert.match(execute, /delaySeconds: result\.requestIntervalSeconds/);
            assert.match(queue, /delaySeconds\?: number/);
            assert.match(engine, /startIcaiSyncContinuationEngine/);
            assert.match(engine, /runIcaiSyncContinuationSource/);
            assert.match(engine, /finalizeIcaiSyncContinuationEngine/);
            assert.match(engine, /orchestration_key/);
            assert.match(service, /"\/start","\/source","\/finalize"/);
            assert.match(migration, /CREATE TABLE IF NOT EXISTS icai_sync_source_states/);
            assert.match(migration, /PRIMARY KEY\(run_id, source_id\)/);
            assert.match(live, /json_extract\(payload_json,'\$\.mode'\)='source'/);
            assert.match(live, /icai_sync_source_states/);
            assert.match(live, /childJobs\.length === sourceTotal/);
          });
          '''
          phase5.write_text(tests)

          Path('.github/workflows/part1-icai-continuation-patch.yml').unlink()
          PY
