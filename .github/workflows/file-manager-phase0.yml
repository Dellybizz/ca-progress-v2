name: File manager Phase 0 reliability baseline
on:
  push:
    branches: [onboarding-design-phase7]
    paths: [scripts/file-manager/**, .github/workflows/file-manager-phase0.yml]
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: [scripts/file-manager/**, .github/workflows/file-manager-phase0.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file-manager-phase0-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  baseline:
    if: github.event_name != 'pull_request' || (github.head_ref == 'onboarding-design-phase7' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Existing reliability suite
        run: npm test
      - name: Validate scoped cleanup guards
        run: node scripts/file-manager/fixture-object-audit-checks.mjs
      - name: Measure actual workspace query
        run: node scripts/file-manager/workspace-baseline.mjs
      - name: Audit live schema and exact historical test object
        run: node scripts/file-manager/run-live-baseline.mjs
      - name: Verify normal signed-in upload and exact private download
        run: node scripts/resources/verify-live-upload-roundtrip.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-manager-phase0-${{ github.event.pull_request.head.sha || github.sha }}
          path: deployment-evidence/file-manager-phase0/*.json
          if-no-files-found: ignore
