name: Stage 2 Phase 1 Fix And Validate Candidate

on:
  push:
    branches: [stage2-phase1-inventory-temp]
    paths:
      - .github/workflows/stage2-phase1-build-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CANDIDATE_BRANCH: stage2-phase1-runtime-candidate

jobs:
  fix-validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply strict TypeScript row-shape fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace('app/api/planner/today/order/route.ts',
          '''  if (rows.error || !rows.data || rows.data.length !== itemIds.length) {
            return NextResponse.json({ error: "One or more plan items could not be organised." }, { status: 409 });
          }

          const planId = rows.data[0]?.plan_id;
          const planIds = new Set(rows.data.map((row) => row.plan_id));''',
          '''  const rowData = (rows.data ?? []) as Array<{ id: string; plan_id: string; user_id: string }>;
          if (rows.error || rowData.length !== itemIds.length) {
            return NextResponse.json({ error: "One or more plan items could not be organised." }, { status: 409 });
          }

          const planId = rowData[0]?.plan_id;
          const planIds = new Set(rowData.map((row) => row.plan_id));''')

          replace('lib/auth/server.ts',
          '''  if (attempts.error || levels.error || !attempts.data?.length) return [{ key: "undecided", label: "Not decided yet", kind: "runtime_fallback" }];
          const levelById = new Map(levels.data.map((level) => [level.id, level.code as CALevel]));
          const grouped = new Map<string, { label: string; levels: Set<CALevel> }>();
          for (const row of attempts.data) {''',
          '''  const attemptRows = (attempts.data ?? []) as Array<{ attempt_key: string; label: string; level_id: string }>;
          const levelRows = (levels.data ?? []) as Array<{ id: string; code: CALevel }>;
          if (attempts.error || levels.error || !attemptRows.length) return [{ key: "undecided", label: "Not decided yet", kind: "runtime_fallback" }];
          const levelById = new Map<string, CALevel>(levelRows.map((level) => [level.id, level.code]));
          const grouped = new Map<string, { label: string; levels: Set<CALevel> }>();
          for (const row of attemptRows) {''')

          replace('lib/community/service.ts',
          '''    members: (memberResult.data ?? []).filter((row) => row.user_id !== context.identity.id).map((row) => ({ userId: row.user_id, label: row.label })),''',
          '''    members: ((memberResult.data ?? []) as Array<{ user_id: string; label: string }>).filter((row) => row.user_id !== context.identity.id).map((row) => ({ userId: row.user_id, label: row.label })),''')

          replace('lib/dashboard/reference.ts',
          '''type ResourceSubjectRow = Database["public"]["Tables"]["resource_subject_map"]["Row"];''',
          '''type ResourceSubjectRow = Database["public"]["Tables"]["resource_subject_map"]["Row"];
          type EventRow = Database["public"]["Tables"]["exam_events"]["Row"];''')
          replace('lib/dashboard/reference.ts',
          '''  const examEvents = (eventResponse.data ?? []).filter((event) => event.event_type === "exam_start" || event.event_type === "exam_paper").map((event) => ({ id:event.id,title:event.title,eventType:event.event_type,eventDate:event.event_date,sourceUrl:event.source_url,lastVerifiedAt:event.last_seen_at }));''',
          '''  const examEvents = ((eventResponse.data ?? []) as EventRow[]).filter((event) => event.event_type === "exam_start" || event.event_type === "exam_paper").map((event) => ({ id:event.id,title:event.title,eventType:event.event_type,eventDate:event.event_date,sourceUrl:event.source_url,lastVerifiedAt:event.last_seen_at }));''')

          replace('lib/icai/query.ts',
          '''type EventRow = Database["public"]["Tables"]["exam_events"]["Row"];''',
          '''type EventRow = Database["public"]["Tables"]["exam_events"]["Row"];
          type SyncRunRow = Database["public"]["Tables"]["icai_sync_runs"]["Row"];
          type ReviewRow = Database["public"]["Tables"]["icai_review_queue"]["Row"];
          type ChangeRow = Database["public"]["Tables"]["icai_change_events"]["Row"];''')
          replace('lib/icai/query.ts',
          '''  const levels = levelsResponse.data ?? [];
          const attempts = attemptsResponse.data ?? [];
          const resources = resourcesResponse.data ?? [];
          const sources = sourcesResponse.data ?? [];
          const subjects = subjectsResponse.data ?? [];
          const attemptMaps = attemptMapResponse.data ?? [];
          const subjectMaps = subjectMapResponse.data ?? [];
          const events = eventsResponse.data ?? [];''',
          '''  const levels = (levelsResponse.data ?? []) as LevelRow[];
          const attempts = (attemptsResponse.data ?? []) as AttemptRow[];
          const resources = (resourcesResponse.data ?? []) as ResourceRow[];
          const sources = (sourcesResponse.data ?? []) as SourceRow[];
          const subjects = (subjectsResponse.data ?? []) as SubjectRow[];
          const attemptMaps = (attemptMapResponse.data ?? []) as AttemptMapRow[];
          const subjectMaps = (subjectMapResponse.data ?? []) as SubjectMapRow[];
          const events = (eventsResponse.data ?? []) as EventRow[];''')
          replace('lib/icai/query.ts',
          '''  const sources = sourceResponse.data ?? [];
          const sourceById = new Map(sources.map((source) => [source.id, source]));
          const run = runResponse.data;''',
          '''  const sources = (sourceResponse.data ?? []) as SourceRow[];
          const sourceById = new Map(sources.map((source) => [source.id, source]));
          const run = runResponse.data as SyncRunRow | null;''')
          replace('lib/icai/query.ts',
          '''    reviews: (reviewResponse.data ?? []).map((review) => {''',
          '''    reviews: ((reviewResponse.data ?? []) as ReviewRow[]).map((review) => {''')
          replace('lib/icai/query.ts',
          '''    recentChanges: (changeResponse.data ?? []).map((change) => ({''',
          '''    recentChanges: ((changeResponse.data ?? []) as ChangeRow[]).map((change) => ({''')

          replace('lib/planner/service.ts',
          '''  const userEvents = calendar.events;''',
          '''  const userEvents = calendar.events as unknown as EventRow[];''')
          replace('lib/planner/service.ts',
          '''  const { sessions, progress, error } = await loadActivityRows(identity.id);
          if (error) throw new Error(`Activity could not be loaded: ${error.message}`);''',
          '''  const { sessions, progress } = await loadActivityRows(identity.id);''')

          replace('lib/resources/service.ts',
          '''type ReportRow = Database["public"]["Tables"]["resource_reports"]["Row"];''',
          '''type ReportRow = Database["public"]["Tables"]["resource_reports"]["Row"];
          type NamedRow = { id: string; title: string };''')
          replace('lib/resources/service.ts',
          '''    subjects: new Map((subjects.data ?? []).map((row) => [row.id, row.title])),
            chapters: new Map((chapters.data ?? []).map((row) => [row.id, row.title])),''',
          '''    subjects: new Map(((subjects.data ?? []) as NamedRow[]).map((row) => [row.id, row.title])),
            chapters: new Map(((chapters.data ?? []) as NamedRow[]).map((row) => [row.id, row.title])),''')
          PY

      - name: Enforce zero active Supabase runtime blockers
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          check() {
            label="$1"; pattern="$2"
            hits="$(grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --exclude='env.ts' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=supabase "${pattern}" app components lib server workers proxy.ts 2>/dev/null || true)"
            if [ -n "${hits}" ]; then
              echo "::error title=${label}::Forbidden active-runtime reference found"
              echo "${hits}"
              bad=1
            fi
          }
          check 'Supabase package import' '@supabase/(supabase-js|ssr)'
          check 'Supabase runtime module import' '@/lib/supabase/(server|admin|client|browser|proxy)'
          check 'Supabase client constructor' 'create(Server|Admin)SupabaseClient'
          check 'Active runtime selector' '(CA_DATA_RUNTIME|CA_AUTH_RUNTIME|isCloudflareDataRuntime|isCloudflareAuthRuntime|isD1Runtime)'
          check 'Supabase host/API runtime' '(supabase\.co|SUPABASE_SERVICE_ROLE|NEXT_PUBLIC_SUPABASE)'
          test "${bad}" -eq 0
          echo 'Active runtime reference scan: 0 blockers'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck candidate
        run: npm run typecheck

      - name: Lint candidate
        run: npm run lint

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/planner/today/order/route.ts lib/auth/server.ts lib/community/service.ts lib/dashboard/reference.ts lib/icai/query.ts lib/planner/service.ts lib/resources/service.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Stage 2 D1 runtime typing'
            git push origin HEAD:${CANDIDATE_BRANCH}
          fi
