name: Stage 2 Phase 1 Fix And Validate Candidate

on:
  push:
    branches:
      - stage2-phase1-inventory-temp
    paths:
      - .github/workflows/stage2-phase1-build-candidate.yml
      - scripts/phase5/temp-stage2-phase1-type-fixes.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Switch to semantic candidate and apply fixes
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/phase5/temp-stage2-phase1-type-fixes.py /tmp/stage2-type-fixes.py
          git checkout -B stage2-phase1-runtime-candidate origin/stage2-phase1-runtime-candidate
          python /tmp/stage2-type-fixes.py
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/data/d1/client.ts')
          text = p.read_text()
          old = 'type QueryResult<T = any> = { data: T | null; error: QueryError | null };'
          new = '// eslint-disable-next-line @typescript-eslint/no-explicit-any -- transitional Stage 2 compatibility boundary\ntype QueryResult<T = any> = { data: T | null; error: QueryError | null };'
          if old not in text:
              raise SystemExit('QueryResult compatibility type was not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git status --short

      - name: Scan active runtime
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          scan() {
            hits="$(grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --exclude='env.ts' --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=supabase "$1" app components lib server workers proxy.ts 2>/dev/null || true)"
            if [ -n "$hits" ]; then
              echo "$hits"
              bad=1
            fi
          }
          scan '@supabase/(supabase-js|ssr)'
          scan '@/lib/supabase/(server|admin|client|browser|proxy)'
          scan 'create(Server|Admin)SupabaseClient'
          scan '(CA_DATA_RUNTIME|CA_AUTH_RUNTIME|isCloudflareDataRuntime|isCloudflareAuthRuntime|isD1Runtime)'
          scan '(supabase\.co|SUPABASE_SERVICE_ROLE|NEXT_PUBLIC_SUPABASE)'
          test "$bad" -eq 0
          echo 'Active runtime reference scan: 0 blockers'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Commit validated candidate fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/planner/today/order/route.ts lib/auth/server.ts lib/community/service.ts lib/dashboard/reference.ts lib/data/d1/client.ts lib/icai/query.ts lib/planner/service.ts lib/resources/service.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Stage 2 D1 runtime typing'
            git push origin HEAD:stage2-phase1-runtime-candidate
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
