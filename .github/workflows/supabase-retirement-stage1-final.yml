name: Supabase Retirement Stage 1 Final Gate

on:
  workflow_dispatch:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/supabase-retirement-stage1-final.yml
      - scripts/phase5/d1-retirement-snapshot.mjs

permissions:
  contents: read

env:
  PHASE4_D1_NAME: ca-progress-v2-phase4-shadow
  PHASE3_D1_DATABASE: ca-progress-v2-phase4-shadow
  PHASE4_R2_BUCKET: ca-progress-v2-staging-user-resources
  RETIREMENT_BACKUP_BUCKET: ca-progress-v2-retirement-backups
  RETIREMENT_STAGE1_DURABLE_BUCKET: ca-progress-v2-retirement-backups
  RETIREMENT_STAGE1_DIR: retirement-stage1
  RETIREMENT_STAGE1_EVIDENCE_DIR: retirement-stage1/evidence
  PHASE4_EXPECTED_BRANCH: phase-12-operations-admin-platform
  SMOKE_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SMOKE_MUTATION_AUTH_COOKIE: ${{ secrets.SMOKE_MUTATION_AUTH_COOKIE }}
  SMOKE_MODERATOR_AUTH_COOKIE: ${{ secrets.SMOKE_MODERATOR_AUTH_COOKIE }}
  CI: "true"

jobs:
  stage1-final:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify retirement contracts
        run: |
          node --test tests/retirement-stage1.test.mjs
          node --test tests/phase3-mutation-matrix.test.mjs
          node --test tests/phase4-verification-closure.test.mjs

      - name: Re-prove D1 migration/bootstrap invariants
        run: |
          npm run test:cloudflare-phase4
          npm run d1:phase4:validate

      - name: Create Stage 1 directories
        run: mkdir -p retirement-stage1/evidence retirement-stage1/private retirement-stage1/archive

      - name: Verify migration provenance read-only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PHASE4_D1_NAME" --remote --json --config wrangler.web.jsonc --command "SELECT version FROM _ca_schema_migrations WHERE version IN ('0007','0008','0009','0010','0011') ORDER BY version;" > retirement-stage1/evidence/migration-provenance.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const raw=JSON.parse(readFileSync('retirement-stage1/evidence/migration-provenance.json','utf8'));
          const rows=(Array.isArray(raw)?raw:[raw]).flatMap((entry)=>entry?.results ?? []);
          const versions=rows.map((row)=>String(row.version)).sort();
          if(versions.join(',')!=='0007,0008,0009,0010,0011') throw new Error(`Migration provenance incomplete: ${versions.join(',')}`);
          NODE

      - name: Capture first read-only Supabase freeze snapshot
        env:
          PHASE5_BACKUP_DIR: retirement-stage1/source-before
        run: node scripts/phase5/final-backup.mjs

      - name: Run fresh authenticated production mutation matrix
        run: node scripts/phase5/mutation-matrix.mjs

      - name: Run fresh verification closure
        run: node scripts/phase5/verification-closure.mjs

      - name: Preserve live verification evidence
        run: |
          cp phase3-report/mutation-matrix.json retirement-stage1/evidence/mutation-matrix.json
          cp phase3-report/mutation-matrix.md retirement-stage1/evidence/mutation-matrix.md
          cp phase4-report/phase4-closure.json retirement-stage1/evidence/phase4-closure.json
          cp phase4-report/phase4-closure.md retirement-stage1/evidence/phase4-closure.md
          cp phase4-report/manifest.json retirement-stage1/evidence/phase4-closure-manifest.json

      - name: Capture final read-only Supabase backup
        env:
          PHASE5_BACKUP_DIR: retirement-stage1/source-after
        run: node scripts/phase5/final-backup.mjs

      - name: Prove Supabase remained frozen during Stage 1
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { sourceStateDigest } from './scripts/phase5/retirement-stage1.mjs';
          const before=JSON.parse(readFileSync('retirement-stage1/source-before/supabase-logical-export.json','utf8'));
          const after=JSON.parse(readFileSync('retirement-stage1/source-after/supabase-logical-export.json','utf8'));
          const beforeDigest=sourceStateDigest(before);
          const afterDigest=sourceStateDigest(after);
          const stability={
            stable:beforeDigest===afterDigest,
            beforeContentSha256:beforeDigest,
            afterContentSha256:afterDigest,
            beforeCreatedAt:before.createdAt,
            afterCreatedAt:after.createdAt,
          };
          writeFileSync('retirement-stage1/evidence/source-stability.json',JSON.stringify(stability,null,2));
          if(!stability.stable) throw new Error('Supabase changed during the Stage 1 freeze window.');
          NODE
          rm -f retirement-stage1/source-before/supabase-logical-export.json

      - name: Audit legacy Supabase source against Cloudflare-authoritative D1
        env:
          RETIREMENT_SOURCE_EXPORT: retirement-stage1/source-after/supabase-logical-export.json
          RETIREMENT_SOURCE_AUDIT: retirement-stage1/evidence/post-cutover-source-audit.json
        run: node scripts/phase5/post-cutover-source-audit.mjs

      - name: Capture D1 health and Time Travel rollback bookmark
        run: node scripts/phase5/d1-retirement-snapshot.mjs

      - name: Export current production D1 for durable rollback
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 export "$PHASE4_D1_NAME" --remote --config wrangler.web.jsonc --skip-confirmation --output=retirement-stage1/private/d1-production.sql
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          const path='retirement-stage1/private/d1-production.sql';
          const bytes=readFileSync(path);
          writeFileSync('retirement-stage1/evidence/d1-backup-manifest.json',JSON.stringify({
            format:'cloudflare-d1-sql-export-v1',
            database:process.env.PHASE4_D1_NAME,
            createdAt:new Date().toISOString(),
            sha256:createHash('sha256').update(bytes).digest('hex'),
            bytes:statSync(path).size,
          },null,2));
          NODE

      - name: Capture Worker rollback deployment
        run: npx wrangler deployments list --name ca-progress-v2 --json > retirement-stage1/evidence/worker-deployments.json

      - name: Capture Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.web.jsonc > retirement-stage1/evidence/worker-secrets-raw.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          const raw=JSON.parse(readFileSync('retirement-stage1/evidence/worker-secrets-raw.json','utf8'));
          const rows=Array.isArray(raw)?raw:Array.isArray(raw?.secrets)?raw.secrets:[];
          const names=[...new Set(rows.map((row)=>typeof row==='string'?row:row?.name).filter(Boolean))].sort();
          if(!names.length) throw new Error('No Worker secret names were returned.');
          writeFileSync('retirement-stage1/evidence/worker-secret-names-only.json',JSON.stringify(names,null,2));
          unlinkSync('retirement-stage1/evidence/worker-secrets-raw.json');
          NODE

      - name: Capture Cloudflare binding snapshot
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.web.jsonc','utf8'));
          const bindingNames=[
            ...(config.d1_databases??[]).map((item)=>item.binding),
            ...(config.r2_buckets??[]).map((item)=>item.binding),
            ...(config.services??[]).map((item)=>item.binding),
            ...(config.queues?.producers??[]).map((item)=>item.binding),
            ...(config.durable_objects?.bindings??[]).map((item)=>item.name),
          ].filter(Boolean);
          const snapshot={
            worker:config.name,
            d1:(config.d1_databases??[]).map(({binding,database_name,database_id})=>({binding,database_name,database_id})),
            r2:(config.r2_buckets??[]).map(({binding,bucket_name})=>({binding,bucket_name})),
            services:(config.services??[]).map(({binding,service})=>({binding,service})),
            queues:{
              producers:(config.queues?.producers??[]).map(({binding,queue})=>({binding,queue})),
              consumers:(config.queues?.consumers??[]).map(({queue,dead_letter_queue})=>({queue,dead_letter_queue})),
            },
            durableObjects:(config.durable_objects?.bindings??[]).map(({name,class_name})=>({name,class_name})),
            variableNames:Object.keys(config.vars??{}).sort(),
            bindingNames:[...new Set(bindingNames)].sort(),
          };
          writeFileSync('retirement-stage1/evidence/binding-snapshot.json',JSON.stringify(snapshot,null,2));
          NODE
          cp wrangler.web.jsonc retirement-stage1/evidence/wrangler.web.jsonc

      - name: Build durable retirement archive
        shell: bash
        run: |
          set -euo pipefail
          find retirement-stage1/source-before retirement-stage1/source-after retirement-stage1/evidence retirement-stage1/private -type f -print0 | sort -z | xargs -0 sha256sum > retirement-stage1/evidence/evidence-sha256.txt
          archive="retirement-stage1/archive/ca-progress-v2-retirement-stage1-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
          tar -czf "$archive" -C retirement-stage1 source-before source-after evidence private
          sha256sum "$archive" | awk '{print $1}' > retirement-stage1/archive/archive.sha256
          echo "RETIREMENT_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "RETIREMENT_ARCHIVE_SHA256=$(cat retirement-stage1/archive/archive.sha256)" >> "$GITHUB_ENV"
          echo "RETIREMENT_STAGE1_ARCHIVE_SHA256=$(cat retirement-stage1/archive/archive.sha256)" >> "$GITHUB_ENV"
          echo "RETIREMENT_OBJECT_PREFIX=stage1/${GITHUB_SHA}/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Ensure dedicated private R2 retirement bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket list | grep -Fq "$RETIREMENT_BACKUP_BUCKET"; then
            npx wrangler r2 bucket create "$RETIREMENT_BACKUP_BUCKET"
          fi
          npx wrangler r2 bucket list | grep -F "$RETIREMENT_BACKUP_BUCKET"

      - name: Upload and checksum-verify durable retirement archive
        shell: bash
        run: |
          set -euo pipefail
          object="$RETIREMENT_OBJECT_PREFIX/baseline.tar.gz"
          npx wrangler r2 object put "$RETIREMENT_BACKUP_BUCKET/$object" --file="$RETIREMENT_ARCHIVE" --content-type=application/gzip --remote
          npx wrangler r2 object get "$RETIREMENT_BACKUP_BUCKET/$object" --file=retirement-stage1/archive/verify.tar.gz --remote
          actual=$(sha256sum retirement-stage1/archive/verify.tar.gz | awk '{print $1}')
          test "$actual" = "$RETIREMENT_ARCHIVE_SHA256" || { echo "::error::Durable R2 backup checksum mismatch"; exit 1; }
          rm -f retirement-stage1/archive/verify.tar.gz
          echo "RETIREMENT_STAGE1_DURABLE_OBJECT=$object" >> "$GITHUB_ENV"

      - name: Evaluate definitive Stage 1 baseline
        env:
          RETIREMENT_STAGE1_DURABLE_VERIFIED: "1"
        run: node scripts/phase5/retirement-stage1.mjs

      - name: Preserve closure report beside durable archive
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put "$RETIREMENT_BACKUP_BUCKET/$RETIREMENT_OBJECT_PREFIX/stage1-baseline.json" --file=retirement-stage1/report/stage1-baseline.json --content-type=application/json --remote
          npx wrangler r2 object put "$RETIREMENT_BACKUP_BUCKET/$RETIREMENT_OBJECT_PREFIX/stage1-baseline.md" --file=retirement-stage1/report/stage1-baseline.md --content-type=text/markdown --remote
          npx wrangler r2 object put "$RETIREMENT_BACKUP_BUCKET/$RETIREMENT_OBJECT_PREFIX/archive.sha256" --file=retirement-stage1/archive/archive.sha256 --content-type=text/plain --remote
          npx wrangler r2 object get "$RETIREMENT_BACKUP_BUCKET/$RETIREMENT_OBJECT_PREFIX/stage1-baseline.json" --file=retirement-stage1/archive/report-verify.json --remote
          cmp retirement-stage1/report/stage1-baseline.json retirement-stage1/archive/report-verify.json
          rm -f retirement-stage1/archive/report-verify.json

      - name: Upload sanitized Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: supabase-retirement-stage1-final-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            retirement-stage1/report/
            retirement-stage1/source-before/manifest.json
            retirement-stage1/source-after/manifest.json
            retirement-stage1/evidence/source-stability.json
            retirement-stage1/evidence/post-cutover-source-audit.json
            retirement-stage1/evidence/d1-health.json
            retirement-stage1/evidence/mutation-matrix.json
            retirement-stage1/evidence/mutation-matrix.md
            retirement-stage1/evidence/phase4-closure.json
            retirement-stage1/evidence/phase4-closure.md
            retirement-stage1/evidence/phase4-closure-manifest.json
            retirement-stage1/evidence/d1-backup-manifest.json
            retirement-stage1/evidence/d1-bookmark.json
            retirement-stage1/evidence/worker-deployments.json
            retirement-stage1/evidence/worker-secret-names-only.json
            retirement-stage1/evidence/binding-snapshot.json
            retirement-stage1/evidence/migration-provenance.json
            retirement-stage1/evidence/evidence-sha256.txt
            retirement-stage1/archive/archive.sha256
