name: Phase 5 Source Patch

on:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/phase5-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-operations-admin-platform
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow Phase 5 type fixes
        shell: python
        run: |
          from pathlib import Path

          billing = Path("lib/billing/service.ts")
          text = billing.read_text()
          old = 'import { createAdminSupabaseClient } from "@/lib/supabase/admin";'
          new = 'import { createD1AdminCompatClient } from "@/lib/data/d1/supabase-compat";'
          if old not in text:
              raise SystemExit("billing import patch target not found")
          text = text.replace(old, new, 1)
          old = 'function db() { return createAdminSupabaseClient(); }'
          new = 'function db() { return createD1AdminCompatClient(); }'
          if old not in text:
              raise SystemExit("billing db patch target not found")
          billing.write_text(text.replace(old, new, 1))

          compat = Path("lib/data/d1/supabase-compat.ts")
          text = compat.read_text()
          old = 'const row={...(this.payload??{})};const info=await tableInfo(this.db,this.table);'
          new = 'const row:Record<string,unknown>={...(Array.isArray(this.payload)?{}:(this.payload??{}))};const info=await tableInfo(this.db,this.table);'
          if old not in text:
              raise SystemExit("D1 update narrowing patch target not found")
          compat.write_text(text.replace(old, new, 1))
      - name: Verify TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/billing/service.ts lib/data/d1/supabase-compat.ts
          git commit -m "Fix Phase 5 D1 cutover type boundaries"
          git push origin HEAD:phase-12-operations-admin-platform
