name: Phase 1 Authenticated Mutation Verification

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-operations-admin-platform
    paths:
      - .github/workflows/phase1-authenticated-mutations.yml
      - scripts/phase5/authenticated-mutations.mjs
      - tests/phase1-authenticated-harness.test.mjs
      - package.json

permissions:
  contents: read

jobs:
  authenticated-mutations:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 30
    env:
      SMOKE_MUTATION_AUTH_COOKIE: ${{ secrets.SMOKE_MUTATION_AUTH_COOKIE }}
      SMOKE_MODERATOR_AUTH_COOKIE: ${{ secrets.SMOKE_MODERATOR_AUTH_COOKIE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PHASE1_D1_DATABASE: ca-progress-v2-phase4-shadow
      SMOKE_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Phase 1 harness contract
        run: node --test tests/phase1-authenticated-harness.test.mjs

      - name: Authenticated verification foundation
        run: node scripts/phase5/authenticated-mutations.mjs

      - name: Upload Phase 1 report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase1-authenticated-mutations-${{ github.run_id }}
          path: phase1-report/
          if-no-files-found: error
          retention-days: 14
