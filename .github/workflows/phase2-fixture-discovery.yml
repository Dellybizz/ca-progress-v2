name: Phase 2 Dynamic Fixture Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-operations-admin-platform
    paths:
      - .github/workflows/phase2-fixture-discovery.yml
      - scripts/phase5/fixture-discovery.mjs
      - scripts/phase5/phase2-fixture-helpers.mjs
      - tests/phase2-fixture-discovery.test.mjs
      - wrangler.web.jsonc
      - package.json

permissions:
  contents: read

jobs:
  dynamic-fixtures:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 30
    env:
      SMOKE_MUTATION_AUTH_COOKIE: ${{ secrets.SMOKE_MUTATION_AUTH_COOKIE }}
      SMOKE_MODERATOR_AUTH_COOKIE: ${{ secrets.SMOKE_MODERATOR_AUTH_COOKIE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PHASE2_D1_DATABASE: ca-progress-v2-phase4-shadow
      SMOKE_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Phase 2 fixture contract
        run: node --test tests/phase2-fixture-discovery.test.mjs

      - name: Discover live Phase 2 fixtures
        run: node scripts/phase5/fixture-discovery.mjs

      - name: Upload Phase 2 report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase2-fixture-discovery-${{ github.run_id }}
          path: phase2-report/
          if-no-files-found: error
          retention-days: 14
