name: Supabase Retirement Stage 2 Static Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-operations-admin-platform
    paths:
      - .env.example
      - app/**
      - components/**
      - lib/**
      - server/**
      - workers/**
      - proxy.ts
      - package.json
      - package-lock.json
      - wrangler.web.jsonc
      - wrangler.phase3.jsonc
      - wrangler.phase4.jsonc
      - scripts/**
      - tests/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  stage2-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Enforce zero active Supabase runtime blockers
        run: node scripts/phase5/retirement-stage2-scan.mjs

      - name: Enforce read-only migration-era CI
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/phase5-source-patch.yml
          test ! -e .github/workflows/phase5-lint-patch.yml
          if rg -n 'contents:\s*write|git\s+commit|git\s+push' .github/workflows/phase5-inventory.yml; then
            echo 'phase5-inventory.yml must remain validation-only and read-only.'
            exit 1
          fi

      - name: Verify Stage 2 regression contract
        run: node --test tests/retirement-stage2.test.mjs

      - name: Repository tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Cloudflare Phase 2 regression tests
        run: npm run test:cloudflare-phase2

      - name: D1 Phase 2 migration and bootstrap validation
        run: npm run d1:phase2:validate

      - name: Cloudflare Phase 3 regression tests
        run: npm run test:cloudflare-phase3

      - name: D1 Phase 3 migration and bootstrap validation
        run: npm run d1:phase3:validate

      - name: Cloudflare Phase 4 regression tests
        run: npm run test:cloudflare-phase4

      - name: D1 Phase 4 migration and bootstrap validation
        run: npm run d1:phase4:validate

      - name: Next.js production build
        run: npm run build

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Web Worker dry-run
        run: npx wrangler deploy --dry-run --config wrangler.web.jsonc

      - name: ICAI Worker dry-run
        run: npx wrangler deploy --dry-run --config workers/icai-sync/wrangler.jsonc

      - name: Billing Worker dry-run
        run: npx wrangler deploy --dry-run --config workers/billing/wrangler.jsonc

      - name: Cloudflare Phase 3 Worker dry-run and size budget
        run: npm run cf:check:phase3

      - name: Cloudflare Phase 4 Worker dry-run
        run: npm run cf:check:phase4

      - name: SSR smoke
        run: npm run cf:smoke

      - name: Reconfirm zero active Supabase runtime blockers
        run: node scripts/phase5/retirement-stage2-scan.mjs

      - name: Phase 2 boundary
        run: |
          echo 'Static/build validation only.'
          echo 'Admin/API operations are deployed in the web Worker; there is no separate admin-ops Worker/config in this repository.'
          echo 'Do not create SUPABASE_RETIREMENT_STAGE2.md here.'
          echo 'Stage 2 remains incomplete until live authenticated production verification passes.'
