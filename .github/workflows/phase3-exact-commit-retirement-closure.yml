name: Phase 3 Final Supabase Retirement Reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - phase-12-operations-admin-platform
    paths:
      - scripts/phase5/final-retirement-reconcile.mjs
      - scripts/phase5/retirement-reconcile-core.mjs
      - tests/phase5-retirement-reconciliation.test.mjs
      - .github/workflows/phase3-exact-commit-retirement-closure.yml

permissions:
  contents: read

env:
  TARGET_RUNTIME_COMMIT: 737df990350061007cd46ff4bc2adc576354a27e
  SMOKE_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
  PHASE4_D1_NAME: ca-progress-v2-phase4-shadow
  PHASE4_R2_BUCKET: ca-progress-v2-staging-user-resources
  PHASE5_RETIREMENT_RUN_ID: phase5-retirement-${{ github.run_id }}
  CI: "true"

jobs:
  final-retirement-reconciliation:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout reconciliation code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Record reconciliation provenance
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_RUNTIME_COMMIT^{commit}"
          mkdir -p phase3-final-reconciliation
          git rev-parse HEAD > phase3-final-reconciliation/reconciliation-code-commit.txt
          printf '%s\n' "$TARGET_RUNTIME_COMMIT" > phase3-final-reconciliation/verified-runtime-commit.txt
          printf '%s\n' "$PHASE5_RETIREMENT_RUN_ID" > phase3-final-reconciliation/reconciliation-run-id.txt

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify retirement reconciliation contract
        run: node --test tests/phase5-retirement-reconciliation.test.mjs

      - name: Reconfirm original Phase 4 strict migration contract
        run: npm run test:cloudflare-phase4

      - name: Run read-only legacy Supabase to D1 subset reconciliation
        shell: bash
        run: |
          set -euo pipefail
          TARGET_RUNTIME_COMMIT="$TARGET_RUNTIME_COMMIT" \
          PHASE5_RETIREMENT_REPORT=phase3-final-reconciliation/retirement-reconciliation.json \
          node scripts/phase5/final-retirement-reconcile.mjs

      - name: Require zero missing or mismatched legacy data
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'phase3-final-reconciliation/retirement-reconciliation.json';
          const report = JSON.parse(readFileSync(path, 'utf8'));
          const ok = report.status === 'passed' &&
            report.readOnly === true &&
            Array.isArray(report.failures) && report.failures.length === 0 &&
            Array.isArray(report.discrepancies) && report.discrepancies.length === 0 &&
            Number(report.foreignKeyViolations || 0) === 0 &&
            report.identities?.passed === true &&
            report.storage?.passed === true &&
            report.tables.every((table) => table.passed !== false);
          const summary = {
            schemaVersion: 1,
            phase: 'supabase-retirement-phase-3',
            status: ok ? 'complete' : 'incomplete',
            verifiedRuntimeCommit: process.env.TARGET_RUNTIME_COMMIT,
            reconciliationCodeCommit: process.env.GITHUB_SHA,
            reconciliationRunId: process.env.PHASE5_RETIREMENT_RUN_ID,
            readOnly: report.readOnly,
            legacyRowsVerified: report.legacyRowsVerified,
            legacyIdentitiesVerified: report.identities?.verifiedCount ?? null,
            extraTargetRowsPreserved: report.extraTargetRowsPreserved,
            sourceStorageObjects: report.storage?.sourceObjects ?? null,
            failures: report.failures?.length ?? null,
            discrepancies: report.discrepancies?.length ?? null,
            foreignKeyViolations: report.foreignKeyViolations ?? null,
          };
          writeFileSync('phase3-final-reconciliation/status.json', JSON.stringify(summary, null, 2));
          if (!ok) process.exit(1);
          NODE

      - name: Independent remote D1 foreign-key check
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PHASE4_D1_NAME" --remote --json --config wrangler.web.jsonc --command "PRAGMA foreign_key_check;" > phase3-final-reconciliation/foreign-key-check.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('phase3-final-reconciliation/foreign-key-check.json', 'utf8'));
          const result = Array.isArray(payload) ? payload[0] : payload;
          if (!result?.success || !Array.isArray(result.results) || result.results.length !== 0) process.exit(1);
          NODE

      - name: Production health check after reconciliation
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --max-time 20 -fsS "$SMOKE_BASE_URL/api/health")"
          HEALTH_JSON="$health" node -e 'const x=JSON.parse(process.env.HEALTH_JSON); if(x.status!=="ok" || x.checks?.database!=="ok") process.exit(1)'
          curl --max-time 20 -fsS "$SMOKE_BASE_URL/login" >/dev/null

      - name: Upload final Phase 3 reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase3-supabase-retirement-final-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: phase3-final-reconciliation/
