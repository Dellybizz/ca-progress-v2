name: Phase 3 Final Delta Reconciliation Recovery

on:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - .github/workflows/phase3-exact-commit-retirement-closure.yml

permissions:
  contents: read

env:
  TARGET_COMMIT: 737df990350061007cd46ff4bc2adc576354a27e
  SMOKE_BASE_URL: https://ca-progress-v2.habeebaasif622.workers.dev
  PHASE4_D1_NAME: ca-progress-v2-phase4-shadow
  PHASE4_R2_BUCKET: ca-progress-v2-staging-user-resources
  PHASE4_RUN_ID: phase5-final-delta-${{ github.run_id }}
  CI: "true"

jobs:
  final-delta-reconciliation:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout exact Phase 2 commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_COMMIT"
          echo "Exact Phase 2 commit checked out: $actual"
          echo "Fresh reconciliation run id: $PHASE4_RUN_ID"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Re-prove Phase 4 migration invariants
        run: |
          npm run test:cloudflare-phase4
          npm run d1:phase4:validate

      - name: Apply final production delta with fresh checkpoint and reconcile
        shell: bash
        run: GITHUB_SHA="$TARGET_COMMIT" node scripts/phase4/production-shadow.mjs

      - name: Require fully reconciled final-delta report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-final-reconciliation
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('phase4-report.json', 'utf8'));
          const ok = report.status === 'reconciled' &&
            Array.isArray(report.failures) && report.failures.length === 0 &&
            Array.isArray(report.discrepancies) && report.discrepancies.length === 0 &&
            Number(report.foreignKeyViolations || 0) === 0;
          const summary = {
            schemaVersion: 1,
            phase: 'phase-3-supabase-retirement-final-delta',
            verifiedRuntimeCommit: process.env.TARGET_COMMIT,
            reconciliationRunId: process.env.PHASE4_RUN_ID,
            status: ok ? 'passed' : 'failed',
            sourceStatus: report.status,
            failures: report.failures?.length ?? null,
            discrepancies: report.discrepancies?.length ?? null,
            foreignKeyViolations: report.foreignKeyViolations ?? null,
            sourceFingerprint: report.sourceFingerprint ?? null,
            targetFingerprint: report.targetFingerprint ?? null,
          };
          writeFileSync('phase3-final-reconciliation/status.json', JSON.stringify(summary, null, 2));
          if (!ok) process.exit(1);
          EOF

      - name: Verify remote D1 integrity after final delta
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PHASE4_D1_NAME" --remote --json --config wrangler.web.jsonc --command "PRAGMA foreign_key_check;" > phase3-final-reconciliation/foreign-key-check.json
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('phase3-final-reconciliation/foreign-key-check.json', 'utf8'));
          const result = Array.isArray(payload) ? payload[0] : payload;
          if (!result?.success || !Array.isArray(result.results) || result.results.length !== 0) {
            console.error('Remote D1 foreign-key integrity check failed.');
            process.exit(1);
          }
          EOF

      - name: Verify production health after final delta
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --max-time 20 -fsS "$SMOKE_BASE_URL/api/health")"
          HEALTH_JSON="$health" node -e 'const x=JSON.parse(process.env.HEALTH_JSON); if(x.status!=="ok" || x.checks?.database!=="ok") process.exit(1)'
          curl --max-time 20 -fsS "$SMOKE_BASE_URL/login" >/dev/null

      - name: Upload final reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase3-final-delta-reconciliation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            phase4-report.json
            phase3-final-reconciliation/
