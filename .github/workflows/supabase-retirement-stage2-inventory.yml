name: Supabase Retirement Stage 2 Inventory

on:
  workflow_dispatch:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - scripts/phase5/retirement-stage2-inventory.mjs
      - .github/workflows/supabase-retirement-stage2-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan active runtime for Supabase/fallback callers
        run: node scripts/phase5/retirement-stage2-inventory.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: supabase-retirement-stage2-inventory-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: retirement-stage2-inventory/
