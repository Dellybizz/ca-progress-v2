name: Cloudflare Migration Phase 4 Shadow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-and-reconcile:
    runs-on: ubuntu-latest
    environment: v2-staging
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PHASE4_D1_NAME: ca-progress-v2-phase4-shadow
      PHASE4_R2_BUCKET: ca-progress-v2-staging-user-resources
      PHASE4_RUN_ID: phase4-production-shadow-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:cloudflare-phase4
      - run: npm run d1:phase4:validate
      - run: npm run cf:build
      - run: npm run cf:check:phase4
      - name: Run production-source to isolated D1/R2 shadow migration and reconciliation
        run: npm run phase4:shadow
      - name: Upload Phase 4 reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-reconciliation-${{ github.run_id }}
          path: phase4-report.json
          if-no-files-found: warn
          retention-days: 30

# Phase 4 is closed. This workflow is manual-only during Phase 5 and must not run
# automatically against production-cutover pushes. It still targets only the retained
# ca-progress-v2-phase4-shadow database and never performs a production cutover.
