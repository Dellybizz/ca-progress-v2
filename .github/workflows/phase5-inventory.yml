name: Cloudflare Migration Phase 5 Runtime Inventory

on:
  workflow_dispatch:
  push:
    branches: [phase-12-operations-admin-platform]
    paths:
      - app/**
      - components/**
      - lib/**
      - server/**
      - workers/**
      - scripts/phase5/inventory-runtime.mjs
      - scripts/phase5/retirement-stage2-scan.mjs
      - tests/retirement-stage2.test.mjs
      - .github/workflows/phase5-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate active runtime retirement boundary
        run: node scripts/phase5/retirement-stage2-scan.mjs

      - name: Verify Stage 2 retirement contract
        run: node --test tests/retirement-stage2.test.mjs

      - name: Inventory active Supabase and RPC runtime surface
        run: node scripts/phase5/inventory-runtime.mjs
