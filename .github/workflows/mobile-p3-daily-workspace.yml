name: Mobile P3 daily workspace

on:
  push:
    branches: [mobile-phase7-student-parity]
    paths:
      - scripts/mobile/apply-p3-daily-workspace.mjs
      - .github/workflows/mobile-p3-daily-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-p3-daily-workspace
  cancel-in-progress: false

jobs:
  apply-and-certify:
    if: ${{ !contains(github.event.head_commit.message || '', '[p3-certified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-phase7-student-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Repair patcher typo and syntax-check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/mobile/apply-p3-daily-workspace.mjs')
          s=p.read_text().replace("',$\n'  readTimer()", "',\n'  readTimer()")
          p.write_text(s)
          PY
          node --check scripts/mobile/apply-p3-daily-workspace.mjs
      - name: Apply P3 implementation
        run: node scripts/mobile/apply-p3-daily-workspace.mjs
      - name: Harden P3 generated source and gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          repo=Path('packages/mobile-data/src/repository.ts')
          s=repo.read_text().replace('description:String(payload.description||"")','description:payload.description?String(payload.description):null')
          repo.write_text(s)
          Path('tests/mobile-p3-daily-workspace.test.mjs').write_text(r'''import test from "node:test";
import assert from "node:assert/strict";
import fs from "node:fs";
const main=fs.readFileSync("apps/mobile/src/main.tsx","utf8");
const repo=fs.readFileSync("packages/mobile-data/src/repository.ts","utf8");
const sync=fs.readFileSync("packages/mobile-data/src/sync.ts","utf8");
const server=fs.readFileSync("lib/mobile/sync.ts","utf8");
const offline=fs.readFileSync("app/api/offline/mutations/route.ts","utf8");
const bootstrap=fs.readFileSync("app/api/v1/sync/bootstrap/route.ts","utf8");
const phase8=fs.readFileSync("lib/planner/phase8.ts","utf8");
const goalRoute=fs.readFileSync("app/api/planner/goals/route.ts","utf8");
const has=(source,...parts)=>parts.every(part=>source.includes(part));
test("P3 dashboard uses synchronized verified exam date",()=>{
  assert.ok(has(main,"function ExamCountdown","verified_date","examDate","Open calendar"));
  assert.ok(has(repo,"payload.startDate","verificationStatus","examDate"));
  assert.ok(has(bootstrap,"verificationStatus","a.start_date","a.verification_status='verified'"));
});
test("P3 Today keeps task-only timeline filters",()=>{
  assert.ok(has(main,"Today's timeline",'["pending","all","completed"]','item.kind==="task"'));
});
test("P3 Focus exposes modes and restores persisted timer",()=>{
  assert.ok(has(main,'["focus","stopwatch"]','repository?.readTimer().then(setTimer)','Finish session'));
  assert.ok(has(repo,"INSERT INTO timer_state",'outboxStatement(account.id,{type:"focus_session"'));
});
test("P3 goals and revision settings use local transaction plus outbox",()=>{
  assert.ok(has(repo,"async createGoal","async toggleGoal","async saveRevisionSettings","await transaction([","planner_goal","revision_settings"));
  assert.ok(has(main,"Goals","Revision rhythm","Preferred study days","Save settings"));
});
test("P3 reconnect sync accepts goal and revision mutations end to end",()=>{
  for(const source of [sync,server,offline]){
    assert.ok(has(source,"/api/planner/goals","/api/planner/revision-settings"));
  }
  assert.ok(has(bootstrap,"planner_goal","revision_settings"));
});
test("P3 goal create identity is stable across offline replay",()=>{
  assert.ok(has(phase8,"createId ?? crypto.randomUUID","SELECT id FROM goals WHERE id=?1"));
  assert.ok(has(goalRoute,"clientId?: string","body.clientId || null"));
});
''')
          PY
          node --check tests/mobile-p3-daily-workspace.test.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: P3 contract gate
        run: node --test tests/mobile-p3-daily-workspace.test.mjs
      - name: TypeScript gate
        run: npm run typecheck
      - name: Native bundle gate
        run: npm run native:bundle
      - name: Retained mobile regression gate
        run: npm run test:mobile:phase20
      - name: Diff safety gate
        run: |
          git diff --check
          if git diff --name-only | grep -E '^\.github/workflows/.*deploy|^wrangler|^workers/' ; then
            echo 'P3 unexpectedly touched deployment/runtime infrastructure.' >&2
            exit 1
          fi
      - name: Commit certified P3
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No P3 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/main.tsx apps/mobile/src/styles.css packages/mobile-data/src/repository.ts packages/mobile-data/src/sync.ts lib/mobile/sync.ts lib/planner/phase8.ts app/api/planner/goals/route.ts app/api/offline/mutations/route.ts app/api/v1/sync/bootstrap/route.ts tests/mobile-p3-daily-workspace.test.mjs docs/mobile/P3_DAILY_WORKSPACE_CERTIFICATION.md scripts/mobile/apply-p3-daily-workspace.mjs
          git commit -m 'feat(mobile): complete P3 daily workspace [p3-certified]'
          git push origin HEAD:mobile-phase7-student-parity
