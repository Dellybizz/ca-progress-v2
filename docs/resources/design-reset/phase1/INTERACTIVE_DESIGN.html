<script>
(()=>{const root=document.getElementById('ca-design-reset'),screen=root.querySelector('#ca-phase1-screen'),app=root.querySelector('#ca-phase1-app'),notice=root.querySelector('#ca-phase1-notice');let viewerId='p1',mode='resources',layout='grid',collection='My resources',selected=new Set(),dock=null,newMenu=false,query='',type='all',page=1,transferPaused=false,noteDirty=false,noteTitle='Working capital — quick revision',noteId='n1';let noteBody='<p>Working capital keeps day-to-day operations moving. Focus on the difference between gross and net working capital.</p><h2>Two definitions to remember</h2><p><strong>Gross working capital</strong> is the investment in current assets.</p><p><mark>Net working capital = Current assets − Current liabilities</mark></p><h2>Revision checklist</h2><ul><li>Understand the operating cycle.</li><li>Compare permanent and temporary working capital.</li><li>Practise calculation questions.</li></ul>';
let files=[{id:'p1',name:'Accounting study material',kind:'pdf',meta:'PDF · 4.2 MB',title:'Accounting principles',chapter:'Foundation concepts'},{id:'n1',name:'Working capital — quick revision',kind:'note',meta:'Note · Edited today',title:'Working capital',chapter:'Quick revision'},{id:'p2',name:'Law practice questions',kind:'pdf',meta:'PDF · 1.8 MB',title:'The Indian Contract Act',chapter:'Practice questions'},{id:'i1',name:'Handwritten revision',kind:'image',meta:'Image · 840 KB',title:'Remember the essentials',chapter:'Revision card'},{id:'n2',name:'Audit — key definitions',kind:'note',meta:'Note · Edited yesterday',title:'Audit essentials',chapter:'Key definitions'},{id:'p3',name:'Economics revision pack',kind:'pdf',meta:'PDF · 2.6 MB',title:'Demand and supply',chapter:'Concept summary'},{id:'d1',name:'Study schedule',kind:'document',meta:'Document · 42 KB',title:'This week’s study plan',chapter:'October revision'},{id:'n3',name:'Taxation formula sheet',kind:'note',meta:'Note · Edited yesterday',title:'Taxation formulas',chapter:'Quick reference'}];
files.filter(f=>f.kind==='note').forEach(f=>{f.body=f.id==='n1'?noteBody:'<p>Capture your key definitions and revision points here.</p>';});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=(name)=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';const button=(label,action,extra='')=>'<button type="button" class="cursor-interaction '+extra+'" aria-label="'+esc(({'back':'Back to Resources','clear':'Clear selection','close-dock':'Close panel','details':'File details','viewer-details':'File details','note-options':'Note options','new':'New','save':'Save','list':'List view','grid':'Grid view','pause-transfer':transferPaused?'Resume transfer':'Pause transfer','open-selected':'Open selected','next':'Next page','previous':'Previous page','more':'More actions','format-more':'More formatting'})[action]||action)+'" data-action="'+action+'">'+label+'</button>';const mobile=()=>app.classList.contains('mobile');const glyph=f=>f.kind==='note'?'notebook-pen':f.kind==='image'?'image':f.kind==='pdf'?'file-text':'file';

function card(f){return '<article class="file '+(selected.has(f.id)?'selected':'')+'" data-file="'+f.id+'"><div class="file-top"><input type="checkbox" aria-label="Select '+esc(f.name)+'" data-select="'+f.id+'" '+(selected.has(f.id)?'checked':'')+'><button class="cursor-interaction name" data-open="'+f.id+'" data-tooltip="'+esc(f.name)+'">'+esc(f.name)+'</button><button class="cursor-interaction icon-button" data-details="'+f.id+'" aria-label="Details for '+esc(f.name)+'">'+icon('ellipsis-vertical')+'</button></div><div data-select-card="'+f.id+'" class="cursor-interaction">'+preview(f)+'</div><div class="file-bottom">'+icon(glyph(f))+esc(f.meta)+'</div></article>';}
function details(){const f=files.find(f=>selected.has(f.id))||files[0];return '<aside class="dock" aria-label="File details"><div class="dock-head"><h2>File details</h2>'+button(icon('x'),'close-dock','icon-button')+'</div>'+preview(f)+'<h3 class="dock-file-name">'+esc(f.name)+'</h3>'+button(icon('external-link')+'Open','open-selected','action')+'<dl><div><dt>Type</dt><dd>'+esc(f.kind==='note'?'CA Progress note':f.kind.toUpperCase())+'</dd></div><div><dt>Location</dt><dd>My resources</dd></div><div><dt>Access</dt><dd>Private · Only you</dd></div><div><dt>Chapter</dt><dd>Not assigned</dd></div></dl>'+button(icon('tag')+'Add chapter or tags','tag','action')+'</aside>';}
function transfers(){return '<aside class="dock" aria-label="Transfers"><div class="dock-head"><h2>Transfers</h2>'+button(icon('x'),'close-dock','icon-button')+'</div><div class="transfer-item"><div class="between"><strong>Revision pack.pdf</strong>'+button(icon(transferPaused?'play':'pause'),'pause-transfer','icon-button')+'</div><progress max="100" value="62" aria-label="Revision pack upload progress"></progress><small>'+(transferPaused?'Paused · Ready to resume':'6.2 MB / 10 MB · Uploading')+'</small></div><div class="transfer-item"><div class="between"><strong>Practice questions.pdf</strong>'+icon('check')+'</div><small>Saved · 1.8 MB</small></div>'+button(transferPaused?'Resume upload':'Pause upload','pause-transfer','action')+'</aside>';}
function resourceScreen(){const filtered=files.filter(f=>(type==='all'||f.kind===type)&&f.name.toLowerCase().includes(query.toLowerCase()));const tools=selected.size?'<span class="selection">'+selected.size+' selected</span>'+button(icon('external-link')+'<span class="hide-mobile">Open</span>','open-selected')+button(icon('folder-input')+'<span class="hide-mobile">Move</span>','move')+button(icon('info'),'details','icon-button')+button(icon('ellipsis'),'more','icon-button')+button(icon('x'),'clear','icon-button'):'<select aria-label="Filter by file type" id="ca-type"><option value="all">All types</option><option value="pdf">PDFs</option><option value="note">Notes</option><option value="image">Images</option><option value="document">Documents</option></select><select aria-label="Sort files" id="ca-sort"><option>Last modified</option><option>Name</option></select><span class="spacer"></span>'+button(icon('list'),'list','icon-button')+button(icon('grid-2x2'),'grid','icon-button');
const content='<div class="file-content"><div class="folders">'+['Accounting','Law','Exam revision'].map(name=>'<button type="button" class="cursor-interaction" data-folder="'+name+'">'+icon('folder')+'<span>'+name+'</span></button>').join('')+'</div><div class="files '+layout+'">'+(filtered.length?filtered.map(card).join(''):'<p class="empty">No matching files or notes.</p>')+'</div></div>';
return '<div class="workspace"><nav class="sidebar" aria-label="Resources navigation"><span class="caption">Library</span>'+['My resources','Recent','Starred','Trash'].map((label,i)=>'<button type="button" class="cursor-interaction" data-collection="'+label+'" aria-pressed="'+(collection===label)+'">'+icon(['folder','clock-3','star','trash-2'][i])+label+'</button>').join('')+'<hr>'+['Community','ICAI official'].map((label,i)=>'<button type="button" class="cursor-interaction" data-collection="'+label+'" aria-pressed="'+(collection===label)+'">'+icon(i?'shield-check':'users')+label+'</button>').join('')+'<div class="storage"><div class="track"><span></span></div>280 MB of 1 GB used</div></nav><main class="canvas"><div class="location-row"><h1>'+esc(collection)+'</h1><select class="collection-picker" id="ca-collection" aria-label="Resource collection">'+['My resources','Recent','Starred','Trash','Community','ICAI official'].concat(['My resources','Recent','Starred','Trash','Community','ICAI official'].includes(collection)?[]:[collection]).map(c=>'<option '+(c===collection?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><label class="search">'+icon('search')+'<input id="ca-search" aria-label="Search resources" placeholder="Search files and notes" value="'+esc(query)+'"></label><div class="new-wrap">'+button(icon('plus')+'New','new','primary')+(newMenu?'<div class="menu" aria-label="Create">'+button(icon('upload')+'Upload files','upload')+button(icon('folder-plus')+'New folder','folder')+button(icon('notebook-pen')+'Create note','new-note')+'</div>':'')+'</div></div><div class="tools" aria-label="File actions">'+tools+'</div><div class="'+(dock?'split':'')+'">'+content+(dock==='details'?details():dock==='transfers'?transfers():'')+'</div><div class="transfer-pill">'+icon('cloud-upload')+'<span>1 upload '+(transferPaused?'paused':'in progress')+'</span>'+button('Transfers','transfers')+'</div></main></div><nav class="bottom-nav" aria-label="Mobile app navigation"><span>'+icon('house')+'Home</span><span>'+icon('calendar-days')+'Plan</span><span class="active">'+icon('folder')+'Resources</span><span>'+icon('menu')+'More</span></nav>';}
function pdfPaper(){return '<article class="paper"><div class="eyebrow">Accounting · Study material</div><h1>'+(page===1?'Accounting principles':'Understanding the accounting equation')+'</h1><p>Clear concepts form the foundation of every accounting decision. Use this chapter to understand how transactions are recorded and interpreted.</p><h2>1. The accounting equation</h2><div class="definition">Assets = Liabilities + Owner’s equity</div><p>Every transaction affects at least two accounts. The equation remains balanced throughout the accounting process.</p><table><thead><tr><th>Transaction</th><th>Effect</th></tr></thead><tbody><tr><td>Capital introduced</td><td>Assets and equity increase</td></tr><tr><td>Purchase on credit</td><td>Assets and liabilities increase</td></tr></tbody></table><div class="page-number"><span>CA Progress · Accounting</span><span>'+page+' / 24</span></div></article>';}
function viewerScreen(){const viewed=files.find(f=>f.id===viewerId)||files[0];const pdf=viewed.kind==='pdf';const toolbar=pdf?button(icon('chevron-left'),'previous','icon-button')+'<input id="ca-page" aria-label="PDF page" type="number" min="1" max="24" value="'+page+'"><span style="font-size:12px">of 24</span>'+button(icon('chevron-right'),'next','icon-button')+'<span class="divider"></span><select aria-label="Zoom" id="ca-zoom"><option>Fit width</option><option>75%</option><option>100%</option><option>125%</option></select><span class="divider hide-mobile"></span>'+button(icon('search')+'<span class="hide-mobile">Find</span>','find'):viewed.kind==='image'?'<select aria-label="Image zoom" id="ca-zoom"><option>Fit image</option><option>100%</option><option>200%</option></select>':'<span style="font-size:12px;color:var(--ca-muted)">Text preview</span>';const content=pdf?pdfPaper():viewed.kind==='image'?'<article class="paper"><div class="eyebrow">Image preview</div><div class="image-note" style="font-size:30px;padding:35px;margin:55px auto">Read. Recall.<br>Revise. Repeat.</div></article>':'<article class="paper"><div class="eyebrow">Text preview</div><h1>'+esc(viewed.name)+'</h1><p>Monday · Accounting revision</p><p>Tuesday · Business Law practice</p><p>Wednesday · Audit definitions</p></article>';return '<main class="document-screen"><header class="document-header">'+button(icon('arrow-left'),'back','icon-button')+'<div class="document-title"><strong>'+esc(viewed.name)+(pdf?'.pdf':viewed.kind==='image'?'.jpg':'.docx')+'</strong><small>My resources · Private</small></div>'+button(icon('download')+'<span class="quiet">Download</span>','download')+button(icon('info'),'viewer-details','icon-button')+'</header><div class="document-toolbar">'+toolbar+'</div><div class="document-area">'+(dock==='details'?'<div style="width:100%;max-width:560px">'+details()+'</div>':content)+'</div></main>';}

function editorScreen(){return '<main class="document-screen"><header class="document-header">'+button(icon('arrow-left'),'back','icon-button')+'<div class="document-title"><strong>'+esc(noteTitle)+'</strong><small id="ca-save-status">'+(noteDirty?'Unsaved changes':'Saved in My resources')+'</small></div>'+button(icon('settings-2'),'note-options','icon-button')+button('Save','save','primary')+'</header><div class="document-toolbar"><select aria-label="Paragraph style" id="ca-paragraph"><option>Normal text</option><option>Heading</option><option>Subheading</option></select><span class="divider"></span>'+button('<b>B</b>','bold')+button('<em>I</em>','italic')+button(icon('highlighter'),'highlight','icon-button')+button(icon('list'),'bullets','icon-button')+button(icon('table-2'),'table','icon-button')+button(icon('link'),'link','icon-button')+button(icon('ellipsis'),'format-more','icon-button')+'</div><div class="document-area">'+(dock==='details'?'<aside class="dock" style="width:100%;max-width:560px"><div class="dock-head"><h2>Note options</h2>'+button(icon('x'),'close-dock','icon-button')+'</div><dl><div><dt>Save to</dt><dd>My resources</dd></div><div><dt>Access</dt><dd>Private</dd></div><div><dt>Chapter</dt><dd>Not assigned</dd></div></dl>'+button('Add chapter or tags','tag','action')+'</aside>':'')+'<article class="paper"><input class="editor-title" aria-label="Note title" id="ca-note-title" value="'+esc(noteTitle)+'"><div id="ca-note-body" class="editor-body" contenteditable="true" role="textbox" aria-label="Note content" aria-multiline="true">'+noteBody+'</div></article><footer class="editor-footer"><span>Private note · My resources</span>'+button(icon('folder')+'Show in Resources','show-note')+'</footer></div></main>';}
function render(){root.querySelector('.appbar').hidden=mode!=='resources';screen.innerHTML=mode==='resources'?resourceScreen():mode==='viewer'?viewerScreen():editorScreen();root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===mode)));const filter=root.querySelector('#ca-type');if(filter)filter.value=type;if(window.lucide)window.lucide.createIcons({attrs:{width:17,height:17}});}
function openFile(id){const file=files.find(f=>f.id===id);if(!file)return;if(file.kind==='note'){noteId=file.id;noteTitle=file.name;noteDirty=false;noteBody=file.body||'<p>Capture your key definitions and revision points here.</p>';mode='editor';}else{mode='viewer';viewerId=file.id;}dock=null;newMenu=false;render();}
function saveNote(){const title=root.querySelector('#ca-note-title');const body=root.querySelector('#ca-note-body');if(title)noteTitle=title.value.trim()||'Untitled note';if(body)noteBody=body.innerHTML;const existing=files.find(f=>f.id===noteId);if(existing){existing.name=noteTitle;existing.title=noteTitle;existing.body=noteBody;existing.meta='Note · Edited just now';}else files.unshift({id:noteId,name:noteTitle,title:noteTitle,kind:'note',meta:'Note · Saved just now',chapter:'Revision note',body:noteBody});noteDirty=false;announce('Design preview: note saved in this preview’s Resources.');render();}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.screen){mode=b.dataset.screen;dock=null;newMenu=false;render();return;}if(b.dataset.device){const isMobile=b.dataset.device==='mobile';app.classList.toggle('mobile',isMobile);root.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}if(b.dataset.open){openFile(b.dataset.open);return;}if(b.dataset.details){selected=new Set([b.dataset.details]);dock='details';render();return;}if(b.dataset.collection){collection=b.dataset.collection;selected.clear();dock=null;announce('Design preview: '+collection+' navigation state.');render();return;}if(b.dataset.folder){collection=b.dataset.folder;selected.clear();announce('Design preview: folder navigation; sample contents remain visible.');render();return;}const action=b.dataset.action;if(!action)return;switch(action){case'new':newMenu=!newMenu;break;case'new-note':noteId='new-'+Date.now();noteTitle='Untitled note';noteBody='<p>Start writing your revision note…</p>';noteDirty=true;mode='editor';newMenu=false;dock=null;break;case'back':mode='resources';dock=null;break;case'save':saveNote();return;case'show-note':if(noteDirty){announce('Save your changes before locating the note.');return;}mode='resources';collection='My resources';query='';type='all';selected=new Set([noteId]);dock=null;break;case'list':layout='list';break;case'grid':layout='grid';break;case'clear':selected.clear();break;case'details':case'viewer-details':case'note-options':dock=dock==='details'?null:'details';break;case'close-dock':dock=null;break;case'transfers':dock=dock==='transfers'?null:'transfers';break;case'pause-transfer':transferPaused=!transferPaused;break;case'open-selected':openFile([...selected][0]||files[0].id);return;case'next':page=Math.min(24,page+1);break;case'previous':page=Math.max(1,page-1);break;case'upload':announce('Design only: the simple file picker feeds the separate Transfers panel.');newMenu=false;dock='transfers';break;case'folder':announce('Design only: folder creation uses a compact name dialog.');newMenu=false;break;case'move':announce('Design only: Move opens a folder destination picker.');break;case'tag':announce('Design only: optional tagging opens from details, after creation.');break;case'download':announce('Design only: authorized download starts from the file viewer.');break;case'more':announce('Design only: Rename, Star, Share and Trash belong in this action menu.');break;case'find':announce('Design only: search inside the document without leaving the viewer.');break;default:announce('Design only: '+action+' formatting control.');return;}render();});
root.addEventListener('change',event=>{const el=event.target;if(el.dataset.select){if(el.checked)selected.add(el.dataset.select);else selected.delete(el.dataset.select);render();}else if(el.id==='ca-collection'){collection=el.value;selected.clear();dock=null;render();}else if(el.id==='ca-type'){type=el.value;selected.clear();render();}else if(el.id==='ca-sort'){if(el.value==='Name')files.sort((a,b)=>a.name.localeCompare(b.name));else files.sort((a,b)=>a.id.localeCompare(b.id));render();}else if(el.id==='ca-page'){page=Math.max(1,Math.min(24,Number(el.value)||1));render();}else if(el.id==='ca-zoom'){announce('Design preview: '+el.value+' selected.');}});
root.addEventListener('click',event=>{const target=event.target.closest('[data-select-card]');if(!target)return;const id=target.dataset.selectCard;if(mobile()){openFile(id);return;}selected=new Set([id]);render();});
root.addEventListener('input',event=>{const el=event.target;if(el.id==='ca-search'){query=el.value;const start=el.selectionStart;render();const field=root.querySelector('#ca-search');field.focus();field.setSelectionRange(start,start);}else if(el.id==='ca-note-title'||el.closest('#ca-note-body')){noteDirty=true;if(el.id==='ca-note-title')noteTitle=el.value;else noteBody=root.querySelector('#ca-note-body').innerHTML;const status=root.querySelector('#ca-save-status');if(status)status.textContent='Unsaved changes';}});
root.addEventListener('keydown',event=>{if(event.key==='Escape'){dock=null;newMenu=false;selected.clear();render();}if((event.ctrlKey||event.metaKey)&&event.key==='s'&&mode==='editor'){event.preventDefault();saveNote();}});render();
})();
</script>
</div>
